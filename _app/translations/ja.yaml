    mail: ひとつのドメインに絞り込んだメール一覧。サーバーが扱ったすべてのメールと、それぞれについて下した判断。
    message: 一通のメール。認証の検査とその根拠、すべての配送の試行、そしてスクリプトを取り除いたメール本体。
    templates: ドメインのメールテンプレート。それぞれに変数と翻訳があります。
    template: テンプレートの編集。件名と本文は変数を使え、レイアウトが結果を包みます。
    layout: レイアウトの編集。ドメインが送るすべてのメールを囲む枠です。
    reports: ドメインについて受け取った DMARC 集計レポート。誰がそのドメインとして送信しているかが分かります。
    report: 一通のレポート。どのアドレスがそのドメインとしてどれだけ送り、検証を通ったかどうか。
