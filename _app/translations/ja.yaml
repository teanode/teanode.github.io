  screenshots:
    mailbox: メールボックス。入れ子にできるフォルダー、全体を対象にした検索、そしてメールプログラムのように表示されるメール。
    payments: サークルの誰かに貸した支払いスキルと、その上限、そしてそれを通したすべての呼び出し。
    drawerPayment: Sam のエージェントが Robin の決めた上限を超える支払いを頼んだので、金額と Sam のメモを添えて Robin を待っています。
    recording: 録音した会議。まず決まったことの要約、続いて話し手ごとの文字起こし。
    coding: "コーディングページ。セッションがどのストレージを使うか尋ねていて、選択肢はボタン、その下に回答欄があります。"
    health: ヘルスケア。iPhone からの歩数、睡眠、心拍数、ワークアウトを、一日ずつでも一年でも。
    photoAlbums: アルバム。手で作ったもの、サーバーが提案した旅行から作ったもの、サークルと共有しているもの。
    followups: エージェントがメールから追いかけているもの。請求書、荷物、締め切りは、支払われ、届き、済んだところで閉じられます。
    chatAgent: チャット。エージェントとサークルの人たちが一つの一覧に並び、隣にエージェントとの会話が開いています。見たものは答えの上に並びます。
    priority: 優先：エージェントがあなたを待っていると考えたもの。「スター付き」の隣に。行のしるしは分類、優先度、そして誰かが答えを必要としているかどうかです。
    calendar: カレンダーを週で、リマインダーはすぐ隣のタブに。電話が CalDAV で両方を同期し、メールとして届いた招待は、あなたが答えられる予定になります。
    drawerMail: どのページにもあるチャットの引き出し。荷物と学校のことを尋ねると、エージェントはメールを検索し、読んだメッセージへのリンクを添えて答えます。
    drawerCalendar: 同じ会話の、次の問い。二人のカレンダーと学校からのメールを読み、あなたと Sam に合う時間を挙げ、何かを書く前に確かめます。
    photos: 写真。月ごと、またはすべてを並べたライブラリーは、iPhone のバックアップ、ここでのアップロード、会話からの保存で集まり、アルバムと写っている人へはワンクリックです。
    photoViewer: 一枚の写真と、いつ、どこで、何で撮ったか。場所は変えることも消すこともでき、何が写っているかをエージェントに尋ねることもできます。
    location: 位置情報。名前の付いた場所への一日の訪問を、あなた自身のサーバーを通して描いた地図に。その下にはそれぞれの訪問と滞在時間。
    circleChat: 家族のサークルのチャット。メンバー同士で書き込み、誰かが頼めばエージェントが答えます。
    circles: サークルとその人たち。それぞれがあなたにとって誰か、そして誰かを招待したりアカウントを作ったりする欄。
    contacts: "連絡先ごとのページ：その人が関わるメール、写真、録音と、エージェントがその人について知っていること。"
    passwordsShare: "ログインをサークルと共有する。一人ひとりのために暗号化され、安全コードで相手の正しい鍵かどうかを確かめられます。"
    passwordsAgent: "エージェントに使用を許可したログイン。そのログイン自身のサイトでだけサインインし、パスワードはページに直接入力されてモデルには渡らず、使うたびに記録されます。"
    passwords: "パスワード。ログイン、カード、メモを自分のデバイス上で暗号化し、サークルと共有している項目とエージェントが使える項目に印が付きます。"
    personCard: "チャット、サークル、写真、地図から開ける人のカード：共有されていれば今いる場所と、お互いに共有しているもの。"
    search: "すべてをひとつの検索で：メール、連絡先、エージェントが知っていること、ドキュメントを、それぞれのアクセス規則のもとで。"
    shoppingStore: "店で買い物：Harbor Market ですべてのリストに必要なものを通路順に。Sam が店でチェックしているところ。"
    shopping: "通路ごとに並んだ共有の食料品リスト。品目ごとの用途、数量、前回の価格。"
    journalMonth: "10 月を日ごとのカレンダーで。最初の写真、最高気温、気分を添え、横にはその月の物語。"
    journal: "タイムライン：毎日の見出し、気分、天気、写真を新しい順に。横には今週のここまで。"
    journalDay: "日記の土曜日：エージェントが書いた物語（触れたものはすべてリンク）、大事だった一通のメールとその理由、その日に行った場所を順に。"
    financeSpending: 金融。十二か月の収入と支出、そして残った額。自分の口座どうしで動いたお金は数えません。
    financeCategories: ひと月を支出カテゴリごとに、予算の下に。どの予算も、どこまで使ったかと、月が順調かどうかを言います。
    financeReceipt: レシートの付いた請求。写真から一行ずつ読み取り、印字された合計と照らして検算し、ひとりでに請求と照合しました。
    financeNetWorth: 純資産。持っているもの、負っているもののすべて。つないだ口座から、自分で入れた価値から、そして許したところではエージェントの見積もりから。
    agent: あなたのエージェント自身のページ。何と呼ぶか、どう書くべきか、どのメールボックスに届くか、そして今日いくら使ったか。
    knowledge: エージェントが知っていることの一ページ。パスがその住所で、事実には引用できるよう番号が付き、履歴はどの行を誰が書いたか、その前が何だったかを言います。
    graph: 同じ知識を図にしたもの。ページは種類ごとに、リンクはどう結ばれているかを言い、ダブルクリックでそのページがつながっている先が開きます。
    subscriptions: このメールボックスが受け取るすべてのメーリングリストと、それぞれが送ってきたもの、そして二つの出口：抜けるか、ミュートして自動で振り分けさせるか。
    programs: デバイスごとのアプリパスワード。これでメールプログラムが IMAP でサインインし、サブミッションポートから送信します。
    access: 人、グループ、ロール。グループをひとつのドメインに結び付ければ、その権限はそこまでしか届きません。
    aliases: ドメインのエイリアス。それぞれのパターンがメールボックスへ配送するか、アドレス、webhook、別のメールサーバーへ転送します。
    dns: ドメインの DNS レコード。ダッシュボードがひとつずつ確認し、足りないものや違うものを示します。
    agents: 運用者の側。このサーバーがどのモデルサービスを呼べるか、どのモデルがどの仕事をするか、人が何を有効にできるか、そして上限。
    mail: ひとつのドメインに絞り込んだメール一覧。サーバーが扱ったすべてのメールと、それぞれについて下した判断。
    message: 一通のメール。認証の検査とその根拠、すべての配送の試行、そしてスクリプトを取り除いたメール本体。
    templates: ドメインのメールテンプレート。それぞれに変数と翻訳があります。
    template: テンプレートの編集。件名と本文は変数を使え、レイアウトが結果を包みます。
    layout: レイアウトの編集。ドメインが送るすべてのメールを囲む枠です。
    reports: ドメインについて受け取った DMARC 集計レポート。誰がそのドメインとして送信しているかが分かります。
    report: 一通のレポート。どのアドレスがそのドメインとしてどれだけ送り、検証を通ったかどうか。
