      calendar: ひと月。リマインダーはひと押しで。
      finance: お金の行き先を、月ごとに。
      recording: 録音した会議。まず要点、それから話し手ごとの文字起こし。
      knowledge: Sam が共有した記憶のページ。レシピと、そこに書かれた事実。
      contacts: "Sam が出てくるところならどこからでも開ける Sam のカード。メッセージ、電話、メール、経路、そして Sam の居場所。"
      payment: Sam のエージェントが Robin の買い物スキルで上限を超える支払いを頼んだので、Robin が決めます。
      search: "チャット、メール、連絡先などをひとつの検索で。それぞれから数件ずつ。"
      shopping: "店で買い物：すべてのリストでその店に必要なもの。写真、価格、誰のカートに入っているか。"
