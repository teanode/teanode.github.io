  features:
    authenticates:
      title: すべてを認証する
      body: 受信時に SPF、DKIM、DMARC、ARC を検査し、送信時に署名します。
    forwards:
      title: 柔軟に転送する
      body: パターンで各アドレスを受信箱、webhook、別のサーバーへ振り分けます。
    relays:
      title: 自分のアドレスから送る
      body: デバイスごとの SMTP 資格情報。送信元ひとつに制限もできます。
    shows:
      title: メールを見せる
      body: 各メールの判定と配送の試行、安全に描画した本文。
    sends:
      title: 書いたメールを送る
      body: 変数と翻訳を持つテンプレートと、それを包むレイアウト。
