    mailbox: メールボックス。入れ子にできるフォルダー、全体を対象にした検索、そしてメールプログラムのように表示されるメール。
    priority: 優先：エージェントがあなたを待っていると考えたもの。「スター付き」の隣に。行のしるしは分類、優先度、そして誰かが答えを必要としているかどうかです。
    calendar: カレンダーを週で、リマインダーはすぐ隣のタブに。電話が CalDAV で両方を同期し、メールとして届いた招待は、あなたが答えられる予定になります。
    drawerMail: どのページにもあるチャットの引き出し。今日見ておくべきことを尋ねると、エージェントはメールを検索し、見つけたものから答えます。
    drawerCalendar: 同じ会話の、次の問い。カレンダーの道具を探し、木曜を読んで答えます。
    drawerVoice: 同じ会話を電話で。バーが声に合わせて動き、ここまでに聞き取った言葉がその隣に並び、答えは書かれるそばから読み上げられます。
    drawerHerdr: あなたのコンピューターの Claude Code のセッションが、止まって何かを尋ねています。どこでエージェントと話していても、その質問が選択肢のボタンとともにあなたに届きます。
    herdr: あなたのコンピューターの herdr にあるコーディングのセッション。どれが作業中で、どれが待機中で、どれがあなたを待っているか。
    contacts: アドレス帳。あなたが保つ人々を、CardDAV で電話へ同期します。写真も誕生日もそのままに。かつて書いてきた全員の一覧ではありません。
    financeSpending: 金融。十二か月の収入と支出、そして残った額。自分の口座どうしで動いたお金は数えません。
    financeCategories: ひと月を支出カテゴリごとに、予算の下に。どの予算も、どこまで使ったかと、月が順調かどうかを言います。
    financeReceipt: レシートの付いた請求。写真から一行ずつ読み取り、印字された合計と照らして検算し、ひとりでに請求と照合しました。
    financeNetWorth: 純資産。持っているもの、負っているもののすべて。つないだ口座から、自分で入れた価値から、そして許したところではエージェントの見積もりから。
    agent: あなたのエージェント自身のページ。何と呼ぶか、どう書くべきか、どのメールボックスに届くか、そして今日いくら使ったか。
    knowledge: エージェントが知っていることの一ページ。パスがその住所で、事実には引用できるよう番号が付き、履歴はどの行を誰が書いたか、その前が何だったかを言います。
    graph: 同じ知識を図にしたもの。ページは種類ごとに、リンクはどう結ばれているかを言い、ダブルクリックでそのページがつながっている先が開きます。
    subscriptions: このメールボックスが受け取るすべてのメーリングリストと、それぞれが送ってきたもの、そして二つの出口：抜けるか、ミュートして自動で振り分けさせるか。
    programs: デバイスごとのアプリパスワード。これでメールプログラムが IMAP でサインインし、サブミッションポートから送信します。
    access: 人、グループ、ロール。グループをひとつのドメインに結び付ければ、その権限はそこまでしか届きません。
    aliases: ドメインのエイリアス。それぞれのパターンがメールボックスへ配送するか、アドレス、webhook、別のメールサーバーへ転送します。
    dns: ドメインの DNS レコード。ダッシュボードがひとつずつ確認し、足りないものや違うものを示します。
    agents: 運用者の側。このサーバーがどのモデルサービスを呼べるか、どのモデルがどの仕事をするか、人が何を有効にできるか、そして上限。
    mail: ひとつのドメインに絞り込んだメール一覧。サーバーが扱ったすべてのメールと、それぞれについて下した判断。
    message: 一通のメール。認証の検査とその根拠、すべての配送の試行、そしてスクリプトを取り除いたメール本体。
    templates: ドメインのメールテンプレート。それぞれに変数と翻訳があります。
    template: テンプレートの編集。件名と本文は変数を使え、レイアウトが結果を包みます。
    layout: レイアウトの編集。ドメインが送るすべてのメールを囲む枠です。
    reports: ドメインについて受け取った DMARC 集計レポート。誰がそのドメインとして送信しているかが分かります。
    report: 一通のレポート。どのアドレスがそのドメインとしてどれだけ送り、検証を通ったかどうか。
  mailHeading: そして、望むなら自分のメールサーバーも
