welcome:
  headline: 自分のサーバーに住む、あなた専用のアシスタント。
  lead: メールを読み、カレンダーを整え、レシートと税の書類をしまい、会議をまとめ、コーディングのセッションに目を配り、あなたについて知ったことを憶えています。iPhone のアプリから、ブラウザーから、電話で話しかけてください。プログラムひとつ、PostgreSQL ひとつ、あなたのハードウェア。自分の Ollama か vLLM に向ければ、何ひとつこのマシンから出ません。
