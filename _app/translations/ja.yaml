welcome:
  lead: >-
    サイドプロジェクトにも、立ち上げたばかりのスタートアップにも、それぞれのドメインで本物のメール
    アドレスを。そのたびにメールボックスを運用する必要はありません。TeaNode は小さなオープンソースの
    メールサーバーで、自分で運用します。すべてのドメイン宛のメールを受け取り、本物かどうかを確かめ、いま読んでいる
    受信箱か webhook へ転送します。それらのアドレスから返信や送信もでき、ドメインの鍵で署名されるので、
    迷惑メール扱いにならず相手に届きます。
  notMailbox: >-
    メールボックスサーバーではありません。IMAP も受信箱もありません。メールは今読んでいる場所で
    そのまま読み続けてください。TeaNode が受け持つのは、ドメインと、認証と、ルーティングです。
  getStarted: はじめる
  readDocs: ドキュメントを読む
  viewSource: ソースを見る
  screenshotsHeading: どんな見た目か
  previous: 前のページ
  next: 次のページ
  openPicture: 画像を全画面で開く
  closePicture: 閉じる
  screenshots:
    mail: ひとつのドメインに絞り込んだメール一覧。サーバーが扱ったすべてのメールと、それぞれについて下した判断。
    message: 一通のメール。認証の検査とその根拠、すべての配送の試行、そしてスクリプトを取り除いたメール本体。
    aliases: ドメインのエイリアス。それぞれのパターンがアドレス、webhook、または別のメールサーバーへ転送し、キャッチオールが残りを受け取ります。
    dns: ドメインの DNS レコード。ダッシュボードがひとつずつ確認し、足りないものや違うものを示します。
    templates: ドメインのメールテンプレート。それぞれに変数と翻訳があります。
    template: テンプレートの編集。件名と本文は変数を使え、レイアウトが結果を包みます。
    layout: レイアウトの編集。ドメインが送るすべてのメールを囲む枠です。
    reports: ドメインについて受け取った DMARC 集計レポート。誰がそのドメインとして送信しているかが分かります。
    report: 一通のレポート。どのアドレスがそのドメインとしてどれだけ送り、検証を通ったかどうか。
  whyHeading: なぜ
  why: >-
    ドメインのメールを運用するには、たいていプロバイダーに預けるか、Postfix、Dovecot、OpenDKIM、
    OpenDMARC、SpamAssassin とポリシーデーモンを組み合わせて、それらの足並みを揃え続けるかの
    どちらかです。TeaNode はプログラムひとつと PostgreSQL データベースひとつで、メールを信頼できるか
    どうかを決める認証は組み込みです。
  featuresHeading: できること
  features:
    authenticates:
      title: すべてを認証する
      body: >-
        受信時に SPF、DKIM、DMARC、ARC を検査し、結果をメールごとに表示します。送信メールには
        DKIM 署名を付け、転送するメールには ARC チェーンを残すので、転送先でも検証を通ります。
    forwards:
      title: 柔軟に転送する
      body: >-
        エイリアスは正規表現でアドレスを照合し、メールアドレス、HTTP エンドポイント、または
        別のメールサーバーへ送ります。空のパターンはキャッチオールで、他のどれにも一致しなかった
        ものを受け取ります。
    relays:
      title: 自分のアドレスから送る
      body: >-
        サブミッションポートにデバイスごとの SMTP 資格情報を用意すると、スマートフォン、ノート PC、
        アプリケーションがどのドメインとしてでも送信できます。それぞれを送信元アドレスひとつに
        制限することもできます。
    shows:
      title: メールを見せる
      body: >-
        ダッシュボードは各メールを、認証の判定、配送の試行とその失敗の理由、そしてスクリプトを
        取り除いた本文とともに表示します。リモート画像は求めるまで読み込みません。
    sends:
      title: 書いたメールを送る
      body: >-
        変数と翻訳を持つテンプレート、それを包むレイアウト、自分のドメインから配信する画像、
        そして受信者のメールソフトがそれを取得したかどうかの記録。
    reports:
      title: ドメインについて報告する
      body: >-
        受け取った DMARC 集計レポートは解析して保存されます。誰かが自分のドメインを
        偽っていることに気づけるのは、これのおかげです。
    extras:
      title: 任意の追加機能、すべて既定でオフ
      body: >-
        ClamAV、SpamAssassin、GeoIP、保存メールの S3 ミラー、アドレスの評判が悪いホスト向けの
        送信 SOCKS5 プロキシ、ワイルドカード証明書が必要なときの DNS-01。
    dashboard:
      title: プログラムひとつ、ダッシュボード込み
      body: >-
        ダッシュボードはサーバーに組み込まれていて、他に配備するものはありません。
        コマンドラインクライアントは同じ API にどこからでも届きます。
  startHeading: はじめる
  startLead: docker compose で四つのコマンド、それからダッシュボードを開きます。
  startAfter: >-
    ダッシュボードを最初に開いた人がアカウントを作ります。そこでドメインを追加すると、
    公開すべき DNS レコードが一覧されます。
  startWalkthrough: クイックスタート
  needHeading: 必要なもの
  needs:
    domain: ドメインと、その DNS を編集できること。
    host: 固定アドレスを持ち、ポート 25、80、443、587 に到達できるホスト。
    docker: compose 付きの Docker。compose ファイルが PostgreSQL を起動します。
  needsAfter: >-
    他には何もいりません。クラウドのアカウントも不要です。証明書は HTTP-01 で
    自動取得されるので、設定する DNS API もありません。
