      body: 受信時に SPF、DKIM、DMARC、ARC を検査し、送信時に署名し、迷惑メールは内蔵のフィルターが採点します。
    forwards:
      title: 柔軟に転送する
      body: パターンで各アドレスをメールボックス、別の受信箱、webhook、別のサーバーへ振り分けます。
    calendar:
      title: カレンダーとアドレス帳
      body: 電話が CalDAV と CardDAV で両方を同期し、すでに持っているアプリパスワードでサインインします。招待はメールとして届き、メールとして出ていきます。
    subscriptions:
      title: すべてのメーリングリストと、抜ける道
      body: ニュースレターは専用のページに。送信者が言うやり方で抜けるか、ミュートして自動で振り分けさせます。
    marks:
      title: 送信者の隣に出る印
      body: ドメインが自分のメールのために公開しているロゴを、DMARC を通ったメールにだけ表示します。自分の公開も助けます。
    access:
      title: 人、グループ、ロール
      body: 権限が各自に見えるものを決め、シングルサインオンはディレクトリに従い、変更はすべて記録されます。
    shows:
      title: すべてのメールを見せる
      body: 判定、配送の試行、そしてドメインについての DMARC レポート。
