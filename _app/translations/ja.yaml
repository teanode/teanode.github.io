    geoip: GeoIP
    s3: S3 ミラー
    socks5: SOCKS5 プロキシ
    dns01: DNS-01 証明書
  startHeading: はじめる
  startLead: docker compose で四つのコマンド、それからダッシュボードを開きます。
  startAfter: >-
    ダッシュボードを最初に開いた人がアカウントを作ります。そこでドメインを追加すると、
    公開すべき DNS レコードが一覧されます。
  startWalkthrough: クイックスタート
  needHeading: 必要なもの
  needs:
    domain: DNS を編集できるドメイン。
    host: 固定アドレスを持ち、ポート 25、80、443、587、993 が開いたホスト。
    docker: compose 付きの Docker。PostgreSQL は compose ファイルに含まれます。
  needsAfter: 他には何もいりません。クラウドのアカウントも DNS API も不要で、証明書は自動です。
  questionsHeading: よくある質問
  questions:
    port25:
      question: ポート 25 を開ける必要はありますか？
      answer: >-
        受信にはあります。他のメールサーバーはポート 25 に配送し、他の入口はありません。家庭用回線の
        多くは塞いでいて、小さなサーバーの多くは塞いでいません。[ポート 25 の問題](/doc/getting-started#ポート-25-の問題)
        を参照してください。
    mailprogram:
      question: 自分のメールプログラムで読めますか？
      answer: >-
        読めます。サーバーはポート 993 で IMAP を、143 で STARTTLS を話します。メールボックス設定で
        そのデバイス用のアプリパスワードを作れば、Apple Mail や Thunderbird、スマートフォンが
        アドレスとそのパスワードでサインインします。同じパスワードでポート 587 から送信できます。
    forwarding:
      question: メールボックスを使わなければいけませんか？
      answer: >-
        いいえ。エイリアスはメールボックスへ配送することも、いま読んでいるアドレスへ転送することも、
        webhook へ送ることも、別のメールサーバーへ渡すこともでき、ひとつのドメインで四つとも使えます。
    outbound:
      question: ホストが送信ポート 25 を塞いでいます。送れますか？
      answer: >-
        送れます。リレーの設定をプロバイダーのサブミッションポートに向けてください。Amazon SES、
        Postmark、Resend、Gmail アカウントのどれでも動き、メールは TeaNode が付けた署名を保ちます。
        [リレー](/doc/configuration#smtprelay)を参照してください。
    team:
      question: チームは会社の ID プロバイダーでサインインできますか？
      answer: >-
        できます。OpenID Connect を使います。グループはディレクトリのグループに従わせられ、
        ロールがそのメンバーに見えるもの、できることを決めます。ドメインに結び付けたグループは
        そこまでしか届きません。
    stored:
      question: メールはどこにありますか？
      answer: >-
        あなたのホストの、あなたの PostgreSQL データベースの中に。生のメールはディスクか、
        選んだオブジェクトストアにあります。いくつのフォルダーが持っていてもメールはひとつだけ保存され、
        ひとつでも持っている限り残ります。
