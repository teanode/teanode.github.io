  agent:
    heading: あなただけのアシスタント
    lead: サーバーを言語モデルに向けるだけです。OpenAI、Anthropic、Gemini、同じマシンの Ollama や vLLM、あるいはすでに払っている ChatGPT のプラン。そうすれば家族やチームの各自が自分のエージェントを持ちます。届いたものを仕分け、あなた自身の声で下書きを書き、あなたの暮らしについての問いに答えます。使う権限はちょうどあなたのものだけで、他の誰のものでもありません。
    privacy: あなたが有効にするまで動かず、あなたが許すまでどのメールボックスも見えません。配送の途中でモデルへ送られるものは何もなく、仕事はそのあと待ち行列に入ります。自分の Ollama か vLLM に向ければ、何ひとつこのマシンから出ません。運用者はトークンでも金額でも、使える量に上限を置けます。
    browser: "エージェントがあなたの Chrome のタブで作業しているとき、どのデバイスからでもダッシュボードでそのタブをその場で見て、操作を引き継ぎ、ひとこと添えて返せます。あなたがすべき手順になると、エージェントのほうから頼んできます。"
    points:
      sorts:
        title: 届いたものを仕分ける
        body: 分類、優先度、返事を待っている人がいるかどうか、そして一行の要約。行の上のしるしとして、そして「スター付き」の隣の「優先」ビューに。毎朝の短い便りが、その日に何があるかを告げ、待てないことは届いたときに知らせます。
      drafts:
        title: あなたの声で下書きする
        body: 長い会話の上に畳まれた要約と、あなたが読み、直し、送るための返信。送るのはいつでもあなたです。
      answers:
        title: 許せば、代わりに答える
        body: あなたが書いた方針のもとで。誰に、どんな種類に、いつ、一日に何通まで。どの返信も下書きで待ち、取り消すか引き取るかを選べる帯が付きます。
      asks:
        title: あなたの問いに答える
        body: すべてのページにある引き出しと、端末の teanode agent ask。あなたとして検索し、振り分け、下書きし、取り消せないことの前には必ず立ち止まります。
      follows:
        title: 最後まで追いかける
        body: 支払っていない請求書、届かない荷物、金曜締め切りの書類。一覧に載せておき、支払いや配達が確認できたら閉じ、あなたの出番になったら知らせます。
      nearby:
        title: 近くで何がある
        body: 週に一度、あなたの町のイベント、市場、行ってみたい場所を調べ、翌週の学校や家族の予定と一緒にひとつのまとめで届けます。
    reachLead: あなたが渡せば、届く先
    reach:
      mail: あなたのメール
      contacts: あなたの連絡先
      computer: あなたのコンピューター
      browser: あなたのブラウザー
      web: ウェブ
      calendar: あなたのカレンダー
      reminders: あなたのリマインダー
      notes: あなたのメモ
      finances: あなたのお金
      photos: あなたの写真
      location: あなたの居場所
      codingSessions: あなたのコーディングのセッション
    conversation:
      pick: 会話を選ぶ
      names:
        today: Bertie
        invoices: 未払いの請求書
        trip: あの荷物
      summaries:
        today: 今日わたしを待っているもの、そして Grace への返信
        invoices: 二件が未決、そして下書きした督促
        trip: 配送の追跡と、綴じた領収書
      label: エージェントとの会話の再生
      title: Bertie
      placeholder: エージェントに聞く
      yes: 送る
      no: いまはやめる
      sent: あなたとして送り、この会話に綴じました。
      say:
        today: 今日わたしを待っているものは？
        thursday: 木曜の午後は空いていますか？
        reply: Grace に木曜の四時で大丈夫と伝えて。
        unpaid: どの請求書がまだ未払いですか？
        chase: 古いほうに督促を下書きして。
        parcel: 火曜の荷物はどこですか？
        file: 領収書をノートパソコンに置いて。
      tool:
        searched: 4 通を読みました
        calendar: 9 月 14 日〜18 日
        drafted: Grace Hopper への返信
        invoices: 7 件中 2 件が未決
        contact: Osborne & Sons
        tracking: 運送会社の通知
        saved: ~/Documents/receipt.pdf
      reply:
        today: 三つあります。Grace が契約の返事を待っていて、電話の前に必要です。第 7 条が六十日から九十日に変わりました。Katherine の取締役会の数字は、継続率の確認が要ります。Radia は草稿を読んでほしいと言っていますが、これは今夜で構いません。
        thursday: 二時以降なら空いています。九時半にスタンドアップ、あとは四時の契約レビューまで何もありません。
        unpaid: 二件です。Osborne & Sons、4,200 ポンド、三十一日の超過。Halliday、980 ポンド、八日の超過——こちらは取り決めた支払期限の内側です。
        chase: 書いて下書きに置きました。丁寧で、請求書の番号と日付を書いてあり、もう一件には触れていません。
        parcel: 配達に出ていて、六時前の予定です。運送会社が今朝の七時半に書いてきました。そのメールはアーカイブにあり、通知として仕分けられています。
        file: 保存しました。PDF なので、読み上げるのではなくあなたに残してあります。開いて教えてくれれば、そこから進められます。
      card:
        send: 「木曜の四時で大丈夫」を Grace Hopper に送りますか？
        remind: 督促を Osborne & Sons に送りますか？
  voice:
    heading: 電話する
    lead: チャットの引き出しで電話を押すか、iPhone のアプリから電話して、話してください。言い終えたひとまとまりごとに turn としてエージェントに届き、答えは書かれるそばから読み上げられます。
    body: どのページでも、ノートパソコンでも電話でも使え、話した turn は入力した turn と同じすべての道具に届きます。話したことは会話に残るので、電話を切ってそのまま入力を続けられます。
    more: 音声の仕組み
    points:
      call:
        title: すぐに答える
        body: 調べる前に調べると言い、あなたが長く話しているあいだは聞き手のように小さな相づちを打ちます。
      ear:
        title: 耳のために書く
        body: 答えを先に、短い文をいくつかで、数は人が言うように言い、聞き違えたかもしれない名前に基づいて動く前には確かめます。
      cutIn:
        title: いつでも割り込める
        body: 話し始めると答えはささやき声まで下がり、そして止まります。エージェントは、あなたがどこまで聞いたかを告げられます。
      key:
        title: 鍵はサーバーに
        body: 引き出しはあなたのサーバーと話し、あなたのサーバーがプロバイダーと話します。電話も同じ一日の上限に数えられます。
  coding:
    points:
      sees:
        title: すべてのセッション、すべてのコンピューター
        body: 作業中、待機中、質問中を、ディレクトリとタイトルとともに。「接続」タブでも、コマンドラインからでも。
      types:
        title: 見える場所で入力する
        body: プロセスも、履歴も、画面もひとつで、あなたとエージェントが共有します。いつでも引き取れます。
      asks:
        title: 質問はあなたに届く
        body: "電話に通知が届き、タップするとコーディングページでそのセッションが開き、選択肢がボタンになっています。先に答えた人が優先され、古い答えは拒否されます。"
      page:
        title: セッション専用のページ
        body: ダッシュボードの「コーディング」ページと iPhone アプリで、各セッションの記録や画面をその場で見られ、次のプロンプトを書く欄と、隣に新しいタブを開くボタンがあります。
      remembers:
        title: エージェントが知っていることを知っている
        body: teanode hook を入れると、セッションはプロジェクトのページと前のセッションがどこで止まったかを見て始まり、プロンプトごとにそのプロジェクトから想起したものが届きます。
      anywhere:
        title: MCP を話すものなら何からでも
        body: ChatGPT、Grok、エディター、あるいは引き出しでの電話。セッションに次に何をするかを伝えるか、終わったら知らせるよう頼んでください。
  mcp:
    heading: エディターからも、電話からも
    lead: TeaNode は Model Context Protocol に応えます。コーディングの道具、エディター、あるいは ChatGPT や Grok のようなチャットのアシスタントから、エージェントの道具を使い、エージェントに問いを投げられます。
    body: プログラムに住所を指させ、ブラウザーで承認するだけで、写すトークンはありません。差し出されるのはあなたの権限が許すものから運用者が切ったものを引いたもので、メールを読めない人にメール検索は差し出されず、受け取るトークンもエージェントの道具にしか効きません。設定の「アプリ」で切り離せます。言葉で問いを投げれば、あなたについての記憶を背負った答えが返ります。自分で六回呼ぶ代わりに。
  people:
    points:
      chats:
        title: エージェントがいてもいなくてもチャット
        body: 個別チャットもグループチャットも、エージェントとの会話のすぐ隣に。写真、返信、リアクションも。他人のエージェントは、持ち主が許したときだけあなたに答えます。
      calendars:
        title: みんなのカレンダー
        body: 予定の有無、タイトル、詳細、編集のどれかで自分のカレンダーを共有し、サークルのカレンダーを持ち、みんなの都合の合う時間を探せます。非公開の予定は「予定あり」のままです。
      location:
        title: みんながどこにいるか
        body: いまの場所だけ、またはこれまでの行き先も共有でき、誰かが家に着くと知らせが届きます。共有した相手には、リアルタイムの地図であなたが見えます。
      relationships:
        title: 誰が誰か
        body: Sam はあなたの父だと言えば、Sam の側ではあなたが Sam の子どもになります。見えるのは二人だけで、エージェントは「父に聞いて」が Sam のことだとわかります。
  photos:
    points:
      backup:
        title: バックグラウンドでバックアップ
        body: モバイルデータを許可しない限り Wi-Fi で、Live Photos と編集も含めて送り、ネットワークが切れても続きから再開します。iPhone で消した写真も TeaNode には残ります。
      find:
        title: 写っているもので見つかる
        body: 場所、日付、カメラで探すか、去年の夏に湖で撮った写真をエージェントに頼めます。必要なときだけ写真を見て、見たものを憶えておきます。
      people:
        title: あなたが名前を付ける人
        body: 顔はあなた自身のサーバーでまとめ、アドレス帳の連絡先で名前を付けます。エージェントが推測で顔に名前を付けることはありません。
      albums:
        title: 共有するアルバム
        body: サークルの誰か、またはサークル全体と、見るだけか追加もできるかを選び、撮影場所を含めるかどうかも決めて共有します。
      places:
        title: 撮影場所の訂正
        body: 一枚でも五百枚でも、撮影場所を変えたり消したりできます。都市の一覧はサーバーにあり、地図サービスに問い合わせる必要はありません。
  finance:
    points:
      linked:
        title: つなぐ、または取り込む
        body: SimpleFIN は自分のセットアップトークンで、Plaid は運用者のキーで。どのプロバイダーも届かないカードは、明細書のファイルかスクリーンショットから取り込みます。
      categories:
        title: 自分のカテゴリ
        body: あなた、あなたのルール、銀行のカテゴリの順に分け、最後にモデル。取引を一ページ選べば、それらとその店をまとめて分類できます。
      receipts:
        title: レシートを一行ずつ
        body: チャットに写真で送るか、メールで届いたものを、印字された合計と照らして検算し、請求と照合するので、何を買ったかを検索できます。
      budgets:
        title: 先を見る予算
        body: どれも、まだ来ていない請求も数えて、月がどこへ向かうかを言います。貯蓄目標は毎月いくら要るかを言います。
      netWorth:
        title: 純資産
        body: 口座、保有、家と車を、どの通貨でも。許したものはエージェントが見積もります。
  meetings:
    points:
      live:
        title: 録るそばから文字に
        body: 録音が続くあいだに断片を並べて文字にするので、長い会議でも長くは待ちません。
      speakers:
        title: 誰が何を言ったか
        body: 話し手に一度名前をつければ、どの発言もそれに従います。尋ねるのはまだ誰も名づけていない話し手だけで、言いよどみは省きます。
      corrections:
        title: 直したことは残る
        body: 文字起こしはどの版も残り、あとの処理があなたの直した一行を元に戻すことはありません。
      memory:
        title: 記憶へ
        body: 決まったこと、日付、約束は、それぞれのページに、その録音を引いて載ります。
  memory:
    sourcesLead: あなたが指させば、そこを読みます
    sources:
      checkout: あなたのコンピューターのチェックアウト
      archive: チャットのアーカイブ
      notes: あなたのノート
      wiki: スキル越しの wiki
      web: あなたが挙げたサイト
      sent: あなた自身の送信済みメール
    points:
      writes:
        title: 頼まれなくても書く
        body: 会話が静かになったあとに走る仕事が、その会話が教えたことを書き留めます。だから火曜に言ったことは水曜にもあります。最初の版はモデルにその場で書かせるものでしたが、456 の turn で書いたのは二つだけ、どちらもテストでした。仕事と記憶の道具を渡されたモデルは、仕事をします。
      reads:
        title: すでにあるものを読む
        body: チェックアウト、チャットの書き出し、日付のついたノートの入った folder を指せば、検索でき引用できる写しを保ちます。歩くことも、見分けることも、断ることも、ファイルのあるマシンの上で起きるので、鍵や合言葉が線を渡ることはありません。読んだものは、あなた自身も探せます。エージェントに頼む必要も、turn の代金を払う必要もありません。
      dreams:
        title: あなたが眠るあいだに片づける
        body: あなたが決めた時間帯に、しばらく静かになったあとで、届いたものを読み、その月を書き上げ、変わったページを書き直し、大きくなりすぎたページを分け、そして誰も書かなかったつながりを探して図を歩きます。そのあと、明日あなたが訊きそうな問いを自分に投げ、答えられなかったものを書き留めます。
  featuresHeading: できること
  features:
    mailbox:
      title: すべてのアカウントにメールボックス
      body: 入れ子にできるフォルダー、全体の検索、ルール、下書き、署名、不在時の自動返信、そしてキーボードショートカット。
    imap:
      title: どのメールプログラムでも使える IMAP
      body: 同じメールボックスをどこからでも。デバイスごとのアプリパスワードは送信にも使えます。
    authenticates:
      title: 認証し、採点する
      body: 受信時に SPF、DKIM、DMARC、ARC を検査し、送信時に署名し、迷惑メールは内蔵のフィルターが採点します。
    forwards:
      title: 柔軟に転送する
      body: パターンで各アドレスをメールボックス、別の受信箱、webhook、別のサーバーへ振り分けます。
    calendar:
      title: カレンダー、リマインダー、メモ、連絡先
      body: 電話が CalDAV、CardDAV、IMAP でそれらを同期し、すでに持っているアプリパスワードでサインインします。カレンダー、リマインダー、メモ、連絡先のアプリがそのまま使えます。招待はメールとして届き、メールとして出ていきます。
    subscriptions:
      title: すべてのメーリングリストと、抜ける道
      body: ニュースレターは専用のページに。送信者が言うやり方で抜けるか、ミュートして自動で振り分けさせます。
    marks:
      title: 送信者の隣に出る印
      body: ドメインが自分のメールのために公開しているロゴを、DMARC を通ったメールにだけ表示します。自分の公開も助けます。
    access:
      title: 人、グループ、ロール
      body: 権限が各自に見えるものを決め、シングルサインオンはディレクトリに従い、変更はすべて記録されます。
    shows:
      title: すべてのメールを見せる
      body: 判定、配送の試行、そしてドメインについての DMARC レポート。
  extrasLead: 欲しいときには
  extras:
    templates: テンプレートとレイアウト
    cli: コマンドラインクライアント
    clamav: ClamAV
    spamd: 外部の SpamAssassin
    geoip: GeoIP
    s3: S3 ミラー
    socks5: SOCKS5 プロキシ
    dns01: DNS-01 証明書
  startHeading: はじめる
  startLead: アシスタントだけならコマンド 1 つ。自分のメールがほしくなったら加えてください。
  start:
    assistant:
      title: アシスタントだけ
      note: ドメインもメールのポートもいりません。127.0.0.1:8080 で待ち受けるので、電話から届くように HTTPS のリバースプロキシを前に置きます。
      after: ダッシュボードを開き、アカウントを作って、モデルのキーを貼ります。
    mail:
      title: 自分のメールも
      note: あなたのドメインのメールに、アシスタントと上のすべて。
      after: ダッシュボードを最初に開いた人がアカウントを作ります。そこでドメインを追加すると、公開すべき DNS レコードが一覧されます。
  startWalkthrough: クイックスタート
  closingHeading: 準備ができたら
  closingLead: コマンド 1 つ、アカウント 1 つ、モデルのキー 1 つ。新しいサーバーでだいたい 1 分です。
  startSteps: すべての手順を画像つきで
  needHeading: 必要なもの
  needs:
    host: 動かしっぱなしのコンピューター。Linux ならインストールのコマンドが Docker を入れ、PostgreSQL もいっしょに入ります。
    model: 考えるためのモデル。API キー、すでに払っている ChatGPT のプラン、あるいは自分の Ollama か vLLM。
    https: iPhone のアプリと外出先のために、前に置く HTTPS のアドレス。リバースプロキシならなんでも。
    mail: 自分のメールには、DNS を編集できるドメインと、開いたポート 25、80、443、587、993 も。
  needsAfter: 私たちのところにアカウントはいりません。登録する先がそもそもないからです。アプリへの通知は中継を通りますが、中継に見えるのは呼び出したサーバーのアドレスと、読めない中身だけです。
  questionsHeading: よくある質問
  questions:
    family:
      question: 家族も使えますか？
      answer: 使えます。一人ひとりが同じサーバーに自分のアカウントを持ち、望めば自分のメールボックスとエージェントも持てます。サークルに入れれば、チャットし、カレンダーやアルバムを共有し、みんなの居場所がわかります。共有するのは各自が選んだものだけです。[サークルとチャット](/doc/circles)を見てください。
    mailserver:
      question: メールサーバーを動かさないといけませんか？
      answer: いいえ。アシスタントはそれだけで動き、ドメインも MX レコードもメールのポートもいりません。カレンダー、リマインダー、連絡先もそれぞれ別に選べます。あとから「サーバー」の「セットアップ」でメールを加えても、すでにあるものはそのまま残ります。
    app:
      question: iPhone のアプリは App Store にありますか？
      answer: まだです。いまは TestFlight で試していて、どの TeaNode サーバーにもつながるひとつのアプリとして、まもなく App Store に出ます。それまでは、リポジトリの `ios` ディレクトリから自分の開発者アカウントでビルドできます。
    model:
      question: どのモデルを使い、誰が私のデータを見ますか？
      answer: サーバーが向いているモデルです。OpenAI、Anthropic、Gemini、ChatGPT のプラン、あるいは自分のハードウェア上の Ollama か vLLM。エージェントが読んだものはそのモデルにだけ送られるので、ローカルのモデルなら何ひとつマシンから出ません。運用者は各自が使える額に上限を設けます。
    port25:
      question: ポート 25 を開ける必要はありますか？
      answer: 受信にはあります。他のメールサーバーはポート 25 に配送し、他の入口はありません。家庭用回線の多くは塞いでいて、小さなサーバーの多くは塞いでいません。[ポート 25 の問題](/doc/getting-started#ポート-25-の問題) を参照してください。
    mailprogram:
      question: 自分のメールプログラムで読めますか？
      answer: 読めます。サーバーはポート 993 で IMAP を、143 で STARTTLS を話します。メールボックス設定でそのデバイス用のアプリパスワードを作れば、Apple Mail や Thunderbird、スマートフォンがアドレスとそのパスワードでサインインします。同じパスワードでポート 587 から送信できます。
    forwarding:
      question: メールボックスを使わなければいけませんか？
      answer: いいえ。エイリアスはメールボックスへ配送することも、いま読んでいるアドレスへ転送することも、 webhook へ送ることも、別のメールサーバーへ渡すこともでき、ひとつのドメインで四つとも使えます。
    outbound:
      question: ホストが送信ポート 25 を塞いでいます。送れますか？
      answer: 送れます。リレーの設定をプロバイダーのサブミッションポートに向けてください。Amazon SES、 Postmark、Resend、Gmail アカウントのどれでも動き、メールは TeaNode が付けた署名を保ちます。 [リレー](/doc/configuration#smtprelay)を参照してください。
    team:
      question: チームは会社の ID プロバイダーでサインインできますか？
      answer: できます。OpenID Connect を使います。グループはディレクトリのグループに従わせられ、ロールがそのメンバーに見えるもの、できることを決めます。ドメインに結び付けたグループはそこまでしか届きません。
    stored:
      question: メールはどこにありますか？
      answer: あなたのホストの、あなたの PostgreSQL データベースの中に。生のメールはディスクか、選んだオブジェクトストアにあります。いくつのフォルダーが持っていてもメールはひとつだけ保存され、ひとつでも持っている限り残ります。
start:
  title: はじめる
  headline: 自分のアシスタントが、だいたい 1 分で動きます。
  lead: >-
    つけっぱなしのコンピューターでコマンドを 1 つ、アカウントを 1 つ、モデルサービスのキーを 1 つ。動画は新しいサーバーでの一部始終です。下は同じ手順を 1 つずつ。
  videoLabel: 新しいサーバーに TeaNode を入れて、コマンドからアシスタントの最初の返事まで
  steps:
    install:
      title: コマンドを 1 つ実行する
      body: >-
        TeaNode を置くコンピューターで実行します。Linux のサーバー、余っている PC、Docker Desktop を入れた Mac など。Linux で Docker がなければ先に入れ、TeaNode とデータベースを起動し、ダッシュボードが応答するまで待ちます。
      note: >-
        すべて /opt/teanode（root でなければ ~/teanode）に置き、127.0.0.1:8080 だけで待ち受けます。先に中身を見たければ teanode.com/get.sh を開いてください。もう一度実行してもデータは消えません。
      picture: インストールのコマンドのあとのターミナル。TeaNode が動いていると表示
    account:
      title: アカウントを作る
      body: >-
        ブラウザーで http://127.0.0.1:8080 を開き、ユーザー名とパスワードを決めます。最初に開いた人が管理者になるので、すぐに済ませてください。
      note: >-
        TeaNode が手元ではなくサーバーにあるときは、先に自分のコンピューターで上のトンネルを張ってから同じアドレスを開きます。
      picture: ダッシュボードのアカウント作成フォーム。ユーザー名とパスワードを入力済み
    key:
      title: モデルのキーを貼る
      body: >-
        OpenAI、Anthropic、Gemini のどれかを選んで API キーを貼るか、Ollama や vLLM なら「自分のサーバー」を選びます。「アシスタントを始める」を押すと、キーを確かめ、よいモデルを選び、アシスタントを起動します。
      note: >-
        各サービスにキーの取得リンクがあります。キーはあなたのサーバーにだけ残ります。契約中の ChatGPT プランは「管理」からサインインします。
      picture: OpenAI を選んでキーを貼ったウェルカムカードと、「アシスタントを始める」ボタン
    hello:
      title: あいさつする
      body: >-
        会話が開き、アシスタントが自己紹介します。何でも聞いてください。話すうちにあなたのことを覚えていきます。
      note: >-
        メール、カレンダー、連絡先は「管理 → サーバー → セットアップ」からいつでも追加できます。
      picture: チャットパネルに表示されたアシスタントの最初のメッセージ
