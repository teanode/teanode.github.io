welcome:
  headline: 生活のすべてを見てくれるパーソナルエージェントを、あなたのサーバーで。
  lead: >-
    メール、カレンダー、連絡先、写真と行った場所、ヘルスケア、コーディングセッション、会議、お金、買い物、パスワード。それらが一つのエージェントにつながり、互いの関係まで見え、毎日を日記に残します。すべてはあなた自身のハードウェアの上で、一つのプログラムと一つの PostgreSQL で動くので、あなたの生活はあなたの手元にだけ保存されます。モデルを選ぶのも、エージェントに何を許すのかを決めるのもあなたで、どれでもいつでも取り戻せます。自前の Ollama や vLLM につなげば、何ひとつマシンの外に出ません。
  getStarted: はじめる
  iphoneButton: iPhone のアプリ
  coreHeading: 見てくれるものすべて
  core:
    chat:
      name: チャット
      tile: エージェントと、一緒に暮らす人たちが、一つの会話リストに。
      title: エージェントと話し、家族や友人とも話す
      body: ダッシュボードのどのページでも、iPhone アプリでも、通話でも、エージェントとの会話は一つ。その隣に家族や友人とのチャットがあります。どのチャットでも @ でエージェントを呼び込めます。
      more: エージェントの仕組み
      points:
        call:
          title: 電話をかける
          body: 引き出しかアプリの電話ボタンを押して話すだけ。答えは書かれるそばから読み上げられ、いつでも割り込めます。
        links:
          title: "開く前に中身がわかるリンク"
          body: "送られてきたリンクは追跡用の部分が外され、短くきれいに表示され、リンク先のページのカードが付きます。iPhone ではアプリの中で開きます。"
        mentions:
          title: "メンションと静かなチャット"
          body: "@ で一人を、@全員 で全員をメンションできます。チャットごとに、電話にすべてのメッセージ、メンションだけ、または何も知らせないかを選べます。"
    search:
      name: "検索"
      tile: "メール、チャット、写真、記憶などを一度に探す、ひとつの検索ボックス。"
      title: "ひとつの検索で、すべてを"
      body: "言葉を入れると、サーバーが九つの場所を同時に探します。エージェントとの会話、メール、連絡先、写真、記憶、ドキュメント、録音、場所、お金。それぞれから数件ずつ、まとめて並び、全件の一覧へも進めます。モデルには何も尋ねず、新しい索引も作りません。"
      points:
        areas:
          title: "九つの場所を同時に"
          body: "それぞれの場所を、そのページ自身の探し方で並行して探します。遅いものがあっても、ほかを待たせません。"
        access:
          title: "開けるものだけ"
          body: "それぞれの場所を、そのページと同じ確認のもとで探すので、そこで見られないものが検索に出ることはありません。"
        keys:
          title: "どこからでも"
          body: "サイドバー上部の検索ボックス、どのページでも Control-K か Command-K、iPhone の検索タブ、コマンドラインの teanode search。"
        agent:
          title: "エージェントも検索します"
          body: "思い当たらないことを尋ねられると、エージェントも同じように、あなたが許した範囲で探します。"
    journal:
      name: "日記"
      tile: "一日一ページ。あなたの言葉とその日の物語を、起きたことすべてにつなげて。"
      title: "毎日を、もう一度ひとつに"
      body: "あなたのサーバーには一日がすでにあります。写真、行った場所、メール、会議、お金、コーディングセッション、歩数。日記はそれを起きた順に、一日一ページにまとめます。あなたは自分の言葉とその日の気分を書き、エージェントはドリームの中でその日の物語を書きます。触れたものはすべて本物の記録へのリンクです。"
      more: "日記のしくみ"
      points:
        links:
          title: "コピーせず、リンクする"
          body: "写真、訪問、予定、メール、支払いを、それぞれのページからその場で読み、その日の天気も添えます。消した写真や訂正された請求も、日記に正しく反映されます。"
        words:
          title: "あなたの言葉はあなたのもの"
          body: "覚えておきたいことを書き、5 つの気分から選びます。TeaNode があなたの言葉を変えることはありません。手直しを頼んでも、元の文はワンタップで読めます。"
        story:
          title: "その日の物語"
          body: "エージェントが見出しと数段落を書き、大事だったメールや仕事のメッセージを選んで理由を添えます。間違いを伝えれば、その日を書き直します。"
        zoom:
          title: "週、月、年"
          body: "一週間を並べて、一か月を写真と気分で、一年を気持ちの色で。それぞれに物語があり、あなたの振り返りを書く場所もあります。"
        ask:
          title: "どの日のことも聞ける"
          body: "「先週の木曜は何をした？」には日記から答えます。夜には TeaNode が今日はどうだったか尋ねることもできます。"
    mail:
      name: メール
      tile: 仕分け、要約、最後までの追跡。返信はあなたの口調で下書き。
      title: 自分で片付き、最後まで追いかけるメール
      body: エージェントが届いたメールを読み、大事なものと返事を待たれているものに印を付け、請求書、荷物、締め切りを追いかけ、送るだけの返信を書いておきます。あなたのドメインのための完全なメールサーバーでもあり、ここでも、アプリでも、どのメールソフトでも読めます。
      more: メールサーバーとして使う
    calendar:
      name: カレンダー
      tile: カレンダーとリマインダー。iPhone と同期し、選んだ相手と共有。
      title: あなたについてくるカレンダー
      body: カレンダーとリマインダーはあなたのサーバーにあり、すべての端末と同期します。メールで届いた招待は予定になり、「木曜は空いてる？」と聞けばエージェントが答えて時間を押さえ、家族のカレンダーがあなたのカレンダーの隣に並びます。
      points:
        sync:
          title: どの端末にも
          body: CalDAV で、iPhone 標準のカレンダーとリマインダー、ほかのカレンダーアプリもサーバーと同期します。
        invites:
          title: 招待にそのまま返事
          body: メールで届いた招待は予定になり、会話の中で承諾できます。頼めばエージェントが予定を作ります。
    contacts:
      name: 連絡先
      tile: iPhone と同期する、誰が誰かを知っているアドレス帳。
      title: 誰が誰かを知っているアドレス帳
      body: 写真、誕生日、住所と一緒に残しておきたい人たち。iPhone と同期し、エージェントも知っているので、「父に聞いて」や「Sam の新しい番号」が正しい人に届きます。
      more: サークルの仕組み
      points:
        sync:
          title: iPhone と同期
          body: CardDAV で iPhone の連絡先を写真や誕生日ごと同期し、iPhone のアドレス帳をアプリから取り込むこともできます。
        circles:
          title: 一緒に暮らす人たち
          body: サークルが家族や友人のアカウントをつなぎ、サーバーにアカウントのある連絡先はそのアカウントと結び付くので、チャットや共有がすぐにできます。
        card:
          title: "一人ひとりのカード"
          body: "チャット、サークル、写真、地図から誰でも開けます。あなたとの間柄、その人が共有している居場所と健康、その人の写真、その人とのメール、その人が話した会議。"
        sharing:
          title: "ほとんど何でも共有"
          body: "カレンダー、アルバム、位置情報、ヘルスケア、金融口座、録音、サークル自身の連絡先を、それぞれ選んだレベルで共有でき、すべての共有は「共有」ページにまとまります。"
        agent:
          title: エージェントも知っている
          body: 書くとき、予定を組むとき、整理するときに人を調べ、大事な人ごとに記憶のページを持ちます。
    photos:
      name: 写真
      tile: iPhone からバックアップされ、写っているもので見つかるライブラリー。
      title: 写真ライブラリーを、あなたのサーバーに
      body: iPhone はバックグラウンドでライブラリーをバックアップし、「写真」ページもアプリもエージェントも同じライブラリーを読みます。月ごと、アルバムごと、場所ごと、写っている人ごとに。顔はあなたのサーバーの上で見つけ、外のサービスには渡しません。
      more: 写真の仕組み
    location:
      name: 位置
      tile: 行った場所を一日の地図に。共有するのはあなたが決めたときだけ。
      title: 行った場所を、あなたの手元に
      body: iPhone アプリはアプリを閉じていても訪れた場所を記録し、サーバーがそれに名前を付けて一日を地図に描きます。今いる場所を選んだ人と共有し、どこかに最後に行ったのはいつかをエージェントに聞けます。
      more: 位置の仕組み
      points:
        visits:
          title: 訪問ごとに地図の上に
          body: iPhone 自身の訪問検出による到着と出発、それぞれの滞在時間。オフラインだった一日も、つながったときにまとめて届きます。
        places:
          title: 名前を付けた場所
          body: 自宅、職場、学校、ジム。付けた名前が置き換えられることはなく、着いたことを共有相手に知らせることもできます。
        paths:
          title: "経路、一時停止、静かに"
          body: "共有している人を選ぶと、その日の経路が地図に描かれます。自分の記録を 1 時間や明日まで一時停止したり、一人の到着通知をミュートしたりでき、一緒にいた場所に誰かが着いたことは知らされません。"
        agent:
          title: 日々の流れを覚える
          body: 最後に歯医者に行ったのはいつか、Sam はもう家に着いたかを聞けます。一日でも、期間でも、全部でも、いつでも消せます。
    health:
      name: ヘルスケア
      tile: Apple ヘルスケアのデータを、サーバーでグラフにし、カテゴリーごとに共有。
      title: あなたの健康を、あなたのサーバーに
      body: iPhone アプリが Apple ヘルスケアのデータをあなた自身のサーバーにコピーします。歩数、睡眠、心拍数、ワークアウトなど。ダッシュボードとアプリがグラフにし、あなたが共有しない限り誰にも見えません。
      more: アプリのプライバシーポリシー
      points:
        copied:
          title: Apple ヘルスケアからコピー
          body: HealthKit がアプリに読ませるものすべてを、臨床記録を除いて、保存されるたびに送ります。iPhone 側に別のコピーは残しません。
        charts:
          title: 日、週、年で
          body: 歩数、睡眠の段階、心拍数、体重、ルート付きのワークアウトを、ダッシュボードでも、アプリでも、コマンドラインでも。
        sharing:
          title: カテゴリーごとに共有
          body: 「アクティビティ」や「睡眠」をサークルと共有すると、見えるのは七時間眠ったといった一日のまとめだけ。個々の測定値やルートは見えません。
        agent:
          title: エージェントが読むのは許したときだけ
          body: オンにするまではオフで、読むのはあなた自身のものだけ。期間でも全部でも、いつでも消せます。
    coding:
      name: コーディング
      tile: どのコンピューターの Claude Code と Codex も。質問はあなたに届きます。
      title: コーディングセッションを、どこからでも
      body: Claude Code と Codex のセッションを herdr に置けば、つないだすべてのコンピューターのすべてのセッションがエージェントに見えます。セッションの質問はあなたがどこにいても届き、どのセッションもエージェントの知っていることを知った状態で始まります。
      more: コーディングセッションの仕組み
      points:
        agents:
          title: "セッションのすべてのエージェント"
          body: "動いているセッションが始めたエージェントが、その下にツリーで並びます。それぞれの作業、モデル、まだ動いているかどうかも。"
    knowledge:
      name: ナレッジ
      tile: 生活の中の人、プロジェクト、場所のグラフを、あなたのサーバーに。
      title: あなたを覚えていく記憶
      body: エージェントの知っていることは、人、プロジェクト、場所、ものといったページのグラフで、関係を表すリンクでつながっています。事実には番号があり、元の言葉が付いていて、答えの中で引用できます。どの変更も誰がしたかが残るので、元に戻せます。
      more: 記憶の仕組み
    recordings:
      name: 録音
      tile: iPhone で録った会議を、話し手ごとに文字起こしして要約。
      title: 会議を、まとめておきます
      body: iPhone で会議を録音すると、エージェントがまとめます。録りながら進む文字起こし、名前の付いた話し手、決まったことの要約、そして記憶に書き込まれる学び。元の録音はあなたのサーバーに残ります。
    finance:
      name: お金
      tile: 口座、支出、予算、レシート、純資産、そして税の一年。
      title: あなたのお金と、税金
      body: 銀行、カード、証券口座を Plaid や SimpleFIN でつなぐか明細を取り込めば、お金の行き先、今月の見通し、全部でいくらになるかが見えます。記録はあなた自身のデータベースにあり、エージェントも同じ記録を読むので、聞くだけで済みます。
      more: お金の仕組み
      points:
        taxes:
          title: 税の一年を組み立てる
          body: 給与明細、W-2、1099、1098 を PDF や写真から読み取り、互いに照らし合わせ、一年分を足し上げて、納めることになりそうな額か戻ってきそうな額を出します。
    shopping:
      name: "ショッピング"
      tile: "共有リストを、店でリアルタイムに、そしてレシートでチェック。"
      title: "家族みんなで使う買い物リスト"
      body: "「食料品」や「ホームセンター」のようなリストを作り、サークルと共有します。店ではリストではなく店ごとに買い物します。その店で必要なものを、すべてのリストから通路順に。ほかの人にはカートが埋まっていく様子が見え、レシートが買ったものをチェックします。"
      more: "買い物リストのしくみ"
      points:
        live:
          title: "リアルタイムでチェック"
          body: "カートに最初の品を入れると、ほかの人にあなたが買い物中だと伝わり、チェックはすぐに相手の画面に表示されます。「完了」でカートの中身を購入済みにします。"
        receipts:
          title: "あとはレシートが"
          body: "写真、メール、エージェントに送ったレシートが、買ったものをチェックし、その店での価格を記録します。自信のない照合はあなたを待ち、取り消しもできます。"
        arrive:
          title: "店に着いたら知らせる"
          body: "店に着くと、そこでリストに必要なものを電話が教えてくれます。"
        pictures:
          title: "写真と価格"
          body: "各品目はあなたのサーバーを通じてウェブから写真を見つけ、店ごとの価格の移り変わりを覚えます。"
        agent:
          title: "エージェントに頼むだけ"
          body: "「食料品に卵とお米を追加して」と言うか、手書きのリストの写真を送れば、品目が追加されます。"
    payments:
      name: 支払い
      tile: あなたが決めた上限の中で、あなたの了承を得てエージェントが支払います。
      title: 支払いは、一件ずつあなたの了承で
      body: エージェントは、あなた自身のコンピューターで動く支払いスキル（たとえば Link）を通して支払い、カード番号を目にすることはありません。上限を付けて家族に貸すことができ、上限を超えるものはあなたを待ちます。
      more: 共有の仕組み
      points:
        agent:
          title: エージェントが払い、あなたが確かめる
          body: スキルはあなたとしてサインインしたあなたのコンピューターで動き、どの支払いも支払いアプリであなたの了承を待ちます。
        share:
          title: 家族と共有
          body: 支払いのツールをサークルの誰かに貸せます。相手のエージェントはあなたのコンピューターで支払いますが、残高や取引は読めません。
        limits:
          title: あなたが決める上限
          body: 一回の上限と一か月の上限。それを超えるもの、サーバーが金額を読めないものは、あなたを待ちます。
        approve:
          title: どこからでも承認
          body: 引き出しのカードと iPhone の通知に、金額と相手のエージェントが書いたメモ。子どもには毎回確認する設定があります。
    passwords:
      name: "パスワード"
      tile: "ログイン、パスキー、コードを自分のデバイスで暗号化。エージェントが使うのは、あなたが決めたところだけ。"
      title: "サーバーにも読めないパスワード"
      body: "ログイン、パスキー、ワンタイムコード、カード、メモは、サーバーに届く前に iPhone やブラウザーの中で暗号化されるので、サーバーにも、それを運用する人にも読めません。Chrome と iPhone で自動入力し、サークルと共有し、あなたが選んだいくつかのログインでエージェントにサインインさせられます。"
      more: "パスワードのしくみ"
      points:
        sealed:
          title: "自分のデバイスで暗号化"
          body: "あなただけが知るパスフレーズで開き、その後 iPhone では Face ID で開きます。サーバー、バックアップ、エージェントに見えるのは暗号化されたものだけで、サイトもユーザー名も含みます。"
        fills:
          title: "サインインする場所で入力"
          body: "Chrome 拡張機能がログインを入力し、新しいログインを保存し、パスワードとパスキーを作ります。iPhone では TeaNode が Safari やほかのアプリで、ワンタイムコードまで入力します。"
        share:
          title: "サークルと共有"
          body: "ログインを一人に、またはサークル全体に渡せます。その人たちのデバイスのためだけに暗号化され、変更できるのはあなただけです。"
        agent:
          title: "エージェントはサインインしても、読めない"
          body: "ログインひとつに「エージェントにこの項目の使用を許可する」をオンにすると、あなたが始めた会話の中で、そのログイン自身のサイトでだけ、エージェントがサインインできます。パスワードはページに入るだけで、モデルには渡りません。"
        import:
          title: "そのまま持ってこられる"
          body: "Chrome、Apple のパスワード、Bitwarden、pass から取り込め、いつでも書き出せます。"
  yours:
    heading: あなたのもの、あなただけのもの
    lead: 生活のあらゆる場面に手が届くエージェントは、その生活があなたのものであり続けてこそ持つ価値があります。TeaNode はあなたのハードウェアで動き、すべてをあなた自身のデータベースに置き、あなたがオンにしていないことは何もしません。
    points:
      hardware:
        title: あなたのハードウェアで
        body: "自分のマシンでひとつのプログラムとひとつの PostgreSQL。メール、写真、健康、お金はそこに保存され、私たちのアカウントは一切ありません。パスワードは自分のデバイスで暗号化されるので、サーバーにさえ読めません。"
      model:
        title: モデルはあなたが選ぶ
        body: ホスト型のモデルに送られるのは、一回のやり取りに必要なものだけ。自前の Ollama や vLLM につなげば、何ひとつマシンの外に出ません。
      say:
        title: あなたの了承なしには何もしない
        body: どの機能もオンにするまではオフ。エージェントが触れるのは許したものだけで、取り消せないことの前には必ずあなたの了承を待ちます。
      open:
        title: オープンで、ずっとあなたのもの
        body: MIT ライセンスで、すべてのコードが GitHub に。バックアップも、書き出しも、どこを消すのも、止めるのも、あなた次第です。
  phone:
    heading: iPhone のための TeaNode
    lead: あなたのアシスタントを、ポケットに。
    body: チャットし、電話し、通知から返事をし、どのアプリからでも見ているものを手渡せます。どの TeaNode サーバーにもつながるひとつのアプリです。ダッシュボードに出るコードを読み取れば、何も入力せずにあなたとしてつながります。ダッシュボードでできることは、メールやカレンダーから写真、金融、知識まで、システム自身の部品で、あなたの文字の大きさのままアプリでもできます。
    availability: いまは TestFlight で、まもなく App Store へ
    privacy: アプリのプライバシーポリシー
    galleryLabel: iPhone のアプリの画面。データはすべて架空のものです
    points:
      chat:
        title: どこでも同じ会話
        body: ダッシュボードの引き出しが見せるカードはすべてあり、コーディングのセッションの問いも、選択肢がボタンになって届きます。メール、請求、ページについて、その場から尋ねられます。
      notify:
        title: 通知から返事をする
        body: あなたが必要なことは、そのまま返事のできる通知で届きます。進行中のターンはライブアクティビティとしてロック画面にとどまり、ウィジェットが待っているものと次の予定を見せます。
      call:
        title: 電話する、Siri に頼む
        body: 途中で割り込める本物の電話です。スピーカーでもヘッドホンでも。「TeaNode に聞く」と「TeaNode に電話」は Siri、ショートカット、コントロールセンターから使えます。
      share:
        title: なんでも共有する
        body: 写真、ファイル、リンク、ひとこと。メモを添えてエージェントに届きます。給与明細と W-2 はそのまま「税金」へ、銀行から書き出したファイルは明細書へ。
      record:
        title: 会議を録音する
        body: 電話が録音し、サーバーがそのそばから文字にします。回線が切れて止まったアップロードは、止まったところから続きます。
      photos:
        title: 写真をバックアップ
        body: ライブラリーはバックグラウンドでサーバーへ送られ、ネットワークが切れても続きから再開します。iPhone で消した写真も TeaNode には残ります。
      location:
        title: どこへ行ったか
        body: アプリを閉じていても訪れた場所を記録し、一日の地図にします。共有するのはあなたが選んだ人とだけです。
      search:
        title: "すべてを検索"
        body: "検索タブがチャット、メール、連絡先、写真などを一度に探し、よく使う三つはタブバーに並びます。"
      shopping:
        title: "店で買い物"
        body: "リストを店と通路ごとに。ほかの人と一緒にチェックし、店に着くと知らせます。"
      journal:
        title: "あなたの日記"
        body: "今日の気分をワンタップで、あなたの言葉、TeaNode から見た一日、その上の週と月。"
      passwords:
        title: "パスワードを、すべてのアプリで"
        body: "TeaNode は自動入力のプロバイダーです。Safari やほかのアプリが、そのログイン、パスキー、ワンタイムコードを Face ID で開いて差し出します。"
      setup:
        title: メール、カレンダー、連絡先も
        body: ひとつのプロファイルで、メールボックス、カレンダー、連絡先が iPhone 自身のアプリに加わり、アドレス帳は電話から取り込めます。
    captions:
      conversation: 会話。下書きされたメール、コーディングのセッションからの問い、そしてあなたのひとことを待つ返事。
      chats: "Sam とのチャット。リンクは短くきれいに表示され、リンク先のページのカードが付きます。"
      mail: 受信箱。大事なものと返事のいるものに印がつきます。
      followups: エージェントがメールから追いかけているもの。止まった荷物、期限の過ぎた請求書、金曜締め切りの書類。
      photos: 写真を月ごとに。iPhone からバックアップしたものです。
      location: "画面全体が地図になり、あなたと居場所を共有している人が並び、その日の記録は地図の上の引き出しに。"
