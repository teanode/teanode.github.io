welcome:
  lead: >-
    サイドプロジェクトにも、立ち上げたばかりのスタートアップにも、それぞれのドメインで本物のメール
    アドレスを。そのたびにメールボックスを運用する必要はありません。TeaNode は小さなセルフホストの
    メールサーバーで、すべてのドメイン宛のメールを受け取り、本物かどうかを確かめ、いま読んでいる
    受信箱か webhook へ転送します。それらのアドレスから返信や送信もでき、ドメインの鍵で署名されるので、
    迷惑メール扱いにならず相手に届きます。
  notMailbox: >-
    メールボックスサーバーではないことは、意図したものです。IMAP も受信箱もありません。
    メールは今読んでいる場所でそのまま読み続けてください。TeaNode が受け持つのは、
    ドメインと、認証と、ルーティングです。
  getStarted: はじめる
  readDocs: ドキュメントを読む
  viewSource: ソースを見る
  screenshotCaption: >-
    ひとつのドメインに絞り込んだメール一覧。このサーバーが扱ったすべてのメール、
    それぞれについて下した判断、そして受信者のメールソフトが中の画像を取得したかどうか。
  whyHeading: なぜ
  why: >-
    ドメインのメールを運用するには、たいていプロバイダーに預けるか、Postfix、Dovecot、OpenDKIM、
    OpenDMARC、SpamAssassin とポリシーデーモンを組み合わせて、それらの足並みを揃え続けるかの
    どちらかです。これは実行ファイルひとつと PostgreSQL データベースひとつで、メールを信頼できるか
    どうかを決める認証は、後付けではなく組み込みです。
  featuresHeading: できること
  features:
    authenticates:
      title: すべてを認証する
      body: >-
        受信時に SPF、DKIM、DMARC、ARC を検査し、結果をメールごとに表示します。送信メールには
        DKIM 署名を付け、転送するメールには ARC チェーンを残すので、転送先でも検証を通ります。
    forwards:
      title: 柔軟に転送する
      body: >-
        エイリアスは正規表現でアドレスを照合し、メールアドレス、HTTP エンドポイント、または
        別のメールサーバーへ送ります。空のパターンはキャッチオールで、他のどれにも一致しなかった
        ものを受け取ります。
    relays:
      title: 送信メールを中継する
      body: >-
        サブミッションポートにデバイスごとの SMTP 資格情報を用意し、それぞれを送信元アドレス
        ひとつに制限することもできます。
    shows:
      title: メールを見せる
      body: >-
        ダッシュボードはメールをメールとして表示します。認証の判定、配送の試行とその失敗の理由、
        そしてスクリプトを取り除いた本文。リモート画像は求めるまで読み込みません。
    sends:
      title: 書いたメールを送る
      body: >-
        変数と翻訳を持つテンプレート、それを包むレイアウト、自分のドメインから配信する画像、
        そして受信者のメールソフトがそれを取得したかどうかの記録。
    reports:
      title: ドメインについて報告する
      body: >-
        受け取った DMARC 集計レポートは解析して保存されます。誰かが自分のドメインを
        偽っていることに気づけるのは、これのおかげです。
    extras:
      title: 任意の追加機能、すべて既定でオフ
      body: >-
        ClamAV、SpamAssassin、GeoIP、保存メールの S3 ミラー、アドレスの評判が悪いホスト向けの
        送信 SOCKS5 プロキシ、ワイルドカード証明書が必要なときの DNS-01。
    dashboard:
      title: バイナリひとつ、ダッシュボード込み
      body: >-
        ダッシュボードはサーバーに組み込まれていて、他に配備するものはありません。
        コマンドラインクライアントは同じ API にどこからでも届きます。
  startHeading: はじめる
  startLead: 二つのプログラムをダウンロードし、サーバーを記述し、起動します。
  startAfter: >-
    最初のコマンドは署名鍵の DNS レコードを出力します。サーバーを指す MX レコードとともに
    公開すれば、メールが届き始めます。まだ足りないレコードは、ダッシュボードが正確に示します。
  startWalkthrough: 手順の全体
  needHeading: 必要なもの
  needs:
    domain: ドメインと、その DNS を編集できること。
    host: 固定アドレスを持ち、ポート 25、80、443、587 に到達できるホスト。
    database: 設定と扱ったメールを保存する PostgreSQL。
  needsAfter: >-
    他には何もいりません。クラウドのアカウントも Redis も不要です。証明書は HTTP-01 で
    自動取得されるので、設定する DNS API もありません。
