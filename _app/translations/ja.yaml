      body: つないだマシンのファイル、ターミナル、ブラウザー。取り消せないことの前には、必ずあなたに尋ねます。
  phone:
    heading: iPhone のための TeaNode
    lead: あなたのアシスタントを、ポケットに。
    body: チャットし、電話し、通知から返事をし、どのアプリからでも見ているものを手渡せます。どの TeaNode サーバーにもつながるひとつのアプリです。ダッシュボードに出るコードを読み取れば、何も入力せずにあなたとしてつながります。ダッシュボードでできることは、メールやカレンダーから金融や知識まで、システム自身の部品で、あなたの文字の大きさのままアプリでもできます。
    availability: いまは TestFlight で、まもなく App Store へ
    privacy: アプリのプライバシーポリシー
    galleryLabel: iPhone のアプリの画面。データはすべて架空のものです
    points:
