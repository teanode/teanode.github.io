  agent:
    heading: 望むなら、あなただけのエージェント
    lead: サーバーを言語モデルに向けるだけです。OpenAI、Anthropic、Gemini、あるいは同じマシンの Ollama や vLLM。そうすれば各自が自分のエージェントを持てます。届いたメールを仕分け、あなた自身の声で下書きを書き、あなたのメールについての問いに答えます。使う権限はちょうどあなたのものだけで、他の誰のものでもありません。
    privacy: あなたが有効にするまで動かず、あなたが許すまでどのメールボックスも見えません。配送の途中でモデルへ送られるものは何もなく、仕事はそのあと待ち行列に入ります。自分の Ollama か vLLM に向ければ、何ひとつこのマシンから出ません。運用者はトークンでも金額でも、使える量に上限を置けます。
    points:
      sorts:
        title: 届いたものを仕分ける
        body: 分類、優先度、返事を待っている人がいるかどうか、そして一行の要約。行の上のしるしとして、そして「スター付き」の隣の「優先」ビューに。毎朝の短い便りが、その日に何があるかを告げます。
      drafts:
        title: あなたの声で下書きする
        body: 長い会話の上に畳まれた要約と、あなたが読み、直し、送るための返信。送るのはいつでもあなたです。
      answers:
        title: 許せば、代わりに答える
        body: あなたが書いた方針のもとで。誰に、どんな種類に、いつ、一日に何通まで。どの返信も下書きで待ち、取り消すか引き取るかを選べる帯が付きます。
      asks:
        title: あなたの問いに答える
        body: すべてのページにある引き出しと、端末の teanode agent ask。あなたとして検索し、振り分け、下書きし、取り消せないことの前には必ず立ち止まります。
