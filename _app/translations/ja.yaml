welcome:
  headline: 自分のドメインで、いまの受信箱のまま。
  lead: >-
    TeaNode はオープンソースのメールサーバーです。サイドプロジェクトにも立ち上げたばかりの
    スタートアップにも、それぞれのドメインで本物のアドレスを持たせます。メールを受け取り、本物かどうかを
    確かめ、いま読んでいる受信箱か webhook へ転送します。返信はドメインとして署名されて出ていくので、
    迷惑メール扱いにならず相手に届きます。メールボックスも IMAP もありません。メールは今読んでいる場所で
    そのまま読み続けてください。
  getStarted: はじめる
  readDocs: ドキュメントを読む
  viewSource: ソースを見る
  release:
    latest: ${version}
    licence: MIT ライセンス
    language: Go で書かれています
  flow:
    arrives: メールがドメインに届く
    checks: SPF、DKIM、DMARC を検査し、ARC の封をして転送する
    inbox: いま使っている受信箱
    webhook: webhook
    reply: 返信も送信するメールも、自分のドメインとして署名されて出ていきます。
  screenshotsHeading: どんな見た目か
  previous: 前のページ
  next: 次のページ
  openPicture: 画像を全画面で開く
  closePicture: 閉じる
  screenshots:
    mail: ひとつのドメインに絞り込んだメール一覧。サーバーが扱ったすべてのメールと、それぞれについて下した判断。
    message: 一通のメール。認証の検査とその根拠、すべての配送の試行、そしてスクリプトを取り除いたメール本体。
    aliases: ドメインのエイリアス。それぞれのパターンがアドレス、webhook、または別のメールサーバーへ転送し、キャッチオールが残りを受け取ります。
    dns: ドメインの DNS レコード。ダッシュボードがひとつずつ確認し、足りないものや違うものを示します。
    templates: ドメインのメールテンプレート。それぞれに変数と翻訳があります。
    template: テンプレートの編集。件名と本文は変数を使え、レイアウトが結果を包みます。
    layout: レイアウトの編集。ドメインが送るすべてのメールを囲む枠です。
    reports: ドメインについて受け取った DMARC 集計レポート。誰がそのドメインとして送信しているかが分かります。
    report: 一通のレポート。どのアドレスがそのドメインとしてどれだけ送り、検証を通ったかどうか。
  examplesHeading: たとえば
  examples:
    hello: >-
      ローンチページに載せるアドレス。創業者自身の受信箱へ転送され、同じアドレスから返信できます。
    support: >-
      チケットを起票する webhook へ転送。届く前に SPF、DKIM、DMARC の検査を済ませています。
    noreply: >-
      アプリケーションがサインインコードや領収書を TeaNode 経由で送ります。使う資格情報は
      このアドレスとしてしか送れません。
  whyHeading: なぜ
  why: >-
    ドメインのメールを運用するには、たいていプロバイダーに預けるか、Postfix、Dovecot、OpenDKIM、
    OpenDMARC、SpamAssassin とポリシーデーモンを組み合わせて、それらの足並みを揃え続けるかの
    どちらかです。TeaNode はプログラムひとつと PostgreSQL データベースひとつで、メールを信頼できるか
    どうかを決める認証は組み込みです。
  comparison:
    columns:
      teanode: TeaNode
      cloudflare: Cloudflare Email Routing
      improvmx: ImprovMX
      provider: メールボックスのプロバイダー
    rows:
      receive: 自分のドメインで受け取る
      send: 自分のドメインとして送る
      domains: ドメイン数
      webhook: webhook へ配送
      yours: メールの置き場所
      price: 料金
    cells:
      receive:
        teanode: 'yes'
        cloudflare: 'yes'
        improvmx: 'yes'
        provider: メールボックスへ
      send:
        teanode: 自分の鍵で署名
        cloudflare: 'no'
        improvmx: 有料プランのみ
        provider: 'yes'
      domains:
        teanode: いくつでも
        cloudflare: それぞれ Cloudflare DNS 上に
        improvmx: プランによる
        provider: ユーザー単位で課金
      webhook:
        teanode: 'yes'
        cloudflare: Worker 経由
        improvmx: 'no'
        provider: 'no'
      yours:
        teanode: 自分のホスト、自分のデータベース
        cloudflare: 相手のサーバー
        improvmx: 相手のサーバー
        provider: 相手のサーバー
      price:
        teanode: 無料、MIT
        cloudflare: 無料
        improvmx: 無料枠のあと月額
        provider: ユーザーごとに月額
    note: >-
      2026 年 9 月時点の各社のプランによります。プランは変わりますが、ライセンスは変わりません。
  featuresHeading: できること
  features:
    authenticates:
      title: すべてを認証する
      body: >-
        受信時に SPF、DKIM、DMARC、ARC を検査し、メールごとに表示します。送信メールには DKIM 署名を
        付け、転送するメールには ARC チェーンを残すので、転送先でも検証を通ります。
    forwards:
      title: 柔軟に転送する
      body: >-
        エイリアスはパターンでアドレスを照合し、メールアドレス、webhook、または別のメールサーバーへ
        転送します。キャッチオールが、他のどれにも一致しなかったものを受け取ります。
    relays:
      title: 自分のアドレスから送る
      body: >-
        デバイスごとの SMTP 資格情報で、スマートフォン、ノート PC、アプリケーションがどのドメインと
        してでも送信できます。資格情報は送信元アドレスひとつに制限できます。
    shows:
      title: メールを見せる
      body: >-
        各メールの判定、配送の試行、そしてスクリプトを取り除いた本文。リモート画像は求めるまで
        読み込みません。
    sends:
      title: 書いたメールを送る
      body: >-
        変数と翻訳を持つテンプレート、それを包むレイアウト、自分のドメインから配信する画像。
    reports:
      title: ドメインについて報告する
      body: >-
        受け取った DMARC 集計レポートは解析して保存されます。誰かが自分のドメインを偽っていることに
        気づけるのは、これのおかげです。
  featuresAlso: >-
    ダッシュボードはサーバーに組み込まれ、コマンドラインクライアントは同じ API にどこからでも届きます。
    ClamAV、SpamAssassin、GeoIP、保存メールの S3 ミラー、送信 SOCKS5 プロキシ、DNS-01 証明書は、
    欲しいときにはそこにあり、それまではオフです。
  startHeading: はじめる
  startLead: docker compose で四つのコマンド、それからダッシュボードを開きます。
  startAfter: >-
    ダッシュボードを最初に開いた人がアカウントを作ります。そこでドメインを追加すると、
    公開すべき DNS レコードが一覧されます。
  startWalkthrough: クイックスタート
  needHeading: 必要なもの
  needs:
    domain: ドメインと、その DNS を編集できること。
    host: 固定アドレスを持ち、ポート 25、80、443、587 に到達できるホスト。
    docker: compose 付きの Docker。compose ファイルが PostgreSQL を起動します。
  needsAfter: >-
    他には何もいりません。クラウドのアカウントも不要です。証明書は HTTP-01 で
    自動取得されるので、設定する DNS API もありません。
  questionsHeading: よくある質問
  questions:
    port25:
      question: ポート 25 を開ける必要はありますか？
      answer: >-
        受信にはあります。他のメールサーバーはポート 25 に配送し、他の入口はありません。家庭用回線の
        多くは塞いでいて、小さなサーバーの多くは塞いでいません。[ポート 25 の問題](/doc/getting-started#ポート-25-の問題)
        を参照してください。
    reply:
      question: Gmail から返信できますか？
      answer: >-
        できます。ダッシュボードで SMTP 資格情報を作り、Gmail の「他のメールアドレスを追加」に
        そのアドレスを、送信サーバーに TeaNode を登録します。返信はドメインの鍵で署名されて出ていきます。
    outbound:
      question: ホストが送信ポート 25 を塞いでいます。送れますか？
      answer: >-
        送れます。リレーの設定をプロバイダーのサブミッションポートに向けてください。Amazon SES、
        Postmark、Resend、Gmail アカウントのどれでも動き、メールは TeaNode が付けた署名を保ちます。
        [リレー](/doc/configuration#smtprelay)を参照してください。
    stored:
      question: メールは保存されますか？
      answer: >-
        メールは指定した期間ディスクに残り、ダッシュボードが表示でき、失敗した配送を再試行できます。
        その後は削除されます。保持期間をゼロにするとすべて残ります。
