  agent:
    heading: 一个私人代理，如果你想要的话
    lead: 把服务器指向一个语言模型——OpenAI、Anthropic、Gemini，或者同一台机器上的 Ollama 或 vLLM——每个人就都可以打开属于自己的代理。它给到达的邮件分类，用你自己的口吻写草稿，并回答关于你邮件的问题，用的正好是你的权限，不多也不少。
    privacy: 默认关闭，直到你打开它；在你授予某个邮箱之前，它看不到任何邮箱。邮件在投递的过程中不会有任何东西送到模型那里，这些工作是之后排队做的。把它指向你自己的 Ollama 或者 vLLM，就没有任何东西离开这台机器。运维者可以限制它能花多少，按 token 或者按钱。
