  agent:
    heading: 一个属于你自己的助手
    lead: 把服务器指向一个语言模型（OpenAI、Anthropic、Gemini、同一台机器上的 Ollama 或 vLLM，或者一个你已经在付费的 ChatGPT 套餐），家里或团队里的每个人就都有一个属于自己的代理。它给到达的邮件分类，用你自己的口吻写草稿，并回答关于你生活的问题，用的正好是你的权限，不多也不少。
    privacy: 默认关闭，直到你打开它；在你授予某个邮箱之前，它看不到任何邮箱。邮件在投递的过程中不会有任何东西送到模型那里，这些工作是之后排队做的。把它指向你自己的 Ollama 或者 vLLM，就没有任何东西离开这台机器。运维者可以限制它能花多少，按 token 或者按钱。
    browser: "它在你的 Chrome 标签页里工作时，你可以在任何设备上从仪表盘实时看着那个标签页，接手操作，再附一句话交还给它。轮到你来做的一步，它会请你接手。"
    points:
      sorts:
        title: 给到达的邮件分类
        body: 一个类别、一个优先级、是否有人在等回复，以及一行摘要，作为行上的标签，还有一个和「星标」并列的「优先」视图。每天早上还有一封简报，说这一天有什么；等不得的事一到就告诉你。
      drafts:
        title: 用你的口吻写草稿
        body: 长对话上方折起一段摘要，还有一封写给你读、改、发的回信。发出这件事仍然由你来做。
      answers:
        title: 替你回复，如果你允许
        body: 按你写的策略——对谁、哪几类、什么时候、一天几封。每一封回信都在草稿里等着，带一条横幅让你取消它或者接手。
      asks:
        title: 回答你的问题
        body: 每一页上的一个抽屉，以及终端里的 teanode agent ask。它以你的身份搜索、归档和起草，任何撤不回来的事情都会先停下来等你点头。
      follows:
        title: 一直跟到办完
        body: 还没付的账单、一直没到的包裹、周五要交的表。它记在一张清单上，看到付款或签收就划掉，需要你的时候告诉你。
