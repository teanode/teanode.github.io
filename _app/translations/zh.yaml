  mcp:
    heading: 也可以从你的编辑器里用
    lead: TeaNode 会应答 Model Context Protocol，所以一个写代码的工具或者一个编辑器，可以用你代理的那些工具，也可以直接问你的代理问题。
    body: 调用方拿到的，正好就是那个账号的权限本来就允许的东西，再减去运维者关掉的那些——和一轮对话拿到的是同一份清单，所以一个不能读邮件的人，也不会被给到邮件搜索。边界是 API 令牌，而发不发令牌是运维者的事。用一句话问它，回答里会带着它关于你的全部记忆，而不用你自己去调用六次。
  memory:
    heading: 会学你的记忆
    lead: 代理知道的东西是一张页面构成的图，而不是一串笔记。一个页面就是一个人、一个项目、一个地方、一件东西，或者一段时间；它住在像 projects/greenfinch 这样的路径上，上面每一条事实都有编号、都带着它所依据的原话，都可以在回答里被引用。页面之间用说明关系的连线相连——谁在做什么、谁认识谁、一个决定属于哪里。
    body: 没有任何东西会被删除。几个月没人用到的一条事实会不再主动冒出来，但你搜的时候它还在；每一次改动都记着是谁改的——你、代理、昨晚那一趟、正在被读取的来源——以及改之前是什么，所以你可以把它放回去。这些都在知识页面上，也都在命令行上。
    sourcesLead: 你指给它之后，它会去读的地方
