  examplesHeading: 举个例子
  examples:
    hello: >-
      放在产品发布页上。转发到创始人自己的邮箱，并用同一个地址回复。
    support: >-
      转发到一个 webhook，由它开一张工单；邮件在到达之前已经通过 SPF、DKIM 和 DMARC 检查。
    noreply: >-
      应用程序通过 TeaNode 发送登录验证码和收据，用的凭据只能以这一个地址发信。
  whyHeading: 为什么
  why: >-
    为一个域名运行邮件服务，通常要么交给服务商，要么把 Postfix、Dovecot、OpenDKIM、OpenDMARC、
    SpamAssassin 和一个策略守护进程拼装起来，并让它们保持一致。TeaNode 是一个程序和一个
    PostgreSQL 数据库，决定你的邮件是否可信的身份验证是内建的。
