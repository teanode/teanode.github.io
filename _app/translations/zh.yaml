welcome:
  headline: 照看你整个生活的个人代理，运行在你自己的服务器上。
  lead: >-
    你的邮件、日历和联系人，你的照片和去过的地方，你的健康、编程会话、会议、财务、购物和密码，都连在同一个代理里，它看得出这些之间的关系，还为你的每一天写日记。一切都运行在你自己的硬件上，一个程序加一个 PostgreSQL，所以你的生活只存在你这里，不在别处。用哪个模型由你选，它能碰到什么由你定，任何东西你都可以收回。接上你自己的 Ollama 或 vLLM，就什么都不会离开这台机器。
  getStarted: 开始使用
  iphoneButton: iPhone 应用
  coreHeading: 它照看的一切
  core:
    chat:
      name: 聊天
      tile: 你的代理和一起生活的人，在同一个对话列表里。
      title: 和你的代理聊，也和你的家人朋友聊
      body: 在仪表盘的每个页面、iPhone 应用里和电话中，都是同一段和代理的对话，家人朋友的聊天就在旁边。在任何一个聊天里用 @ 就能把你的代理叫进来。
      more: 代理是怎么工作的
      points:
        call:
          title: 给它打电话
          body: 在抽屉或应用里按电话按钮直接说话。回答边写边读给你听，你随时可以打断。
        links:
          title: "链接先看清再打开"
          body: "别人发来的链接去掉了跟踪参数，显示得又短又干净，下面附一张它指向的网页的卡片。在 iPhone 上，它直接在应用里打开。"
        mentions:
          title: "提及，以及安静的聊天"
          body: "用 @ 提及某个人，或用 @所有人 提及每个人；还可以为每个聊天选择手机接收所有消息、只接收提及，或完全不提醒。"
    search:
      name: "搜索"
      tile: "一个搜索框，同时查邮件、对话、照片、记忆和其他一切。"
      title: "一次搜索，查遍所有"
      body: "输入一个词，你的服务器会同时在九个地方查找：你和代理的对话、邮件、联系人、照片、记忆、文档、录音、地点和财务。每处给出几条结果，分组列出，并能进入完整列表。它不调用任何模型，也不建新的索引。"
      points:
        areas:
          title: "九个地方同时查"
          body: "每个部分都按它自己页面的方式并排搜索，某一处慢了也不会拖住其他部分。"
        access:
          title: "只查你能打开的"
          body: "每个部分都按它自己页面的权限检查来搜索，所以搜索结果里不会出现你在那里看不到的东西。"
        keys:
          title: "随处可用"
          body: "侧边栏顶部的搜索框，任何页面上的 Control-K 或 Command-K，iPhone 上的搜索标签页，以及命令行里的 teanode search。"
        agent:
          title: "你的代理也会搜"
          body: "遇到对不上号的东西，代理也会这样搜索，只在你授权给它的范围内。"
    journal:
      name: "日记"
      tile: "每天一页，有你的文字和这一天的故事，连着当天发生的一切。"
      title: "把每一天重新拼起来"
      body: "你的服务器本来就存着你的一天：照片、去过的地方、邮件、会议、花销、编程会话和步数。日记把它们按发生的顺序合成每天一页。你写下自己的文字和这一天的心情，助手在梦境中写出这一天的故事，提到的每样东西都链接到真实的记录。"
      more: "日记如何运作"
      points:
        links:
          title: "只链接，不复制"
          body: "每一天都从各自的页面实时读取照片、到访、日程、邮件和付款，还有当天的天气。删掉的照片、更正过的扣款，在日记里也随之更新。"
        words:
          title: "你的文字只属于你"
          body: "写下想记住的事，从五种心情中选一种。TeaNode 绝不改动你的文字；请它润色时，你的原文随时一点即见。"
        story:
          title: "这一天的故事"
          body: "助手写下一句标题和几段文字，挑出重要的邮件和工作消息并说明原因。告诉它哪里写错了，它会重写这一天。"
        zoom:
          title: "周、月、年"
          body: "拉远看一周并排的七天、一个月的照片和心情，或按感受着色的一整年，每一段都有自己的故事，也留有你回顾的地方。"
        ask:
          title: "问任何一天"
          body: "“我上周四做了什么？”由日记来回答。每天晚上，TeaNode 还可以问你今天过得怎么样。"
    mail:
      name: 邮件
      tile: 自动分类、摘要、跟进到底，用你的口吻起草回复。
      title: 会自己整理、会跟进到底的邮件
      body: 你的代理读进来的邮件，标出重要的和在等你回复的，跟踪里面的账单、包裹和截止日期，并写好回复等你发送。它本身就是你自己域名的完整邮件服务器，在这里、在应用里或任何邮件程序里都能读。
      more: 把它当作你的邮件服务器
    calendar:
      name: 日历
      tile: 日历和提醒事项，与手机同步，按你的意思共享。
      title: 跟得上你的日历
      body: 日历和提醒事项放在你的服务器上，与每台设备同步。邮件里来的邀请会变成日程，你问代理“周四有空吗”，它会回答并订好时间，家庭日历就在你自己的旁边。
      points:
        sync:
          title: 每台设备上都有
          body: CalDAV 让 iPhone 自带的日历和提醒事项，以及其他日历应用，与服务器保持同步。
        invites:
          title: 邀请，直接回复
          body: 通过邮件收到的邀请会变成日程，你可以在对话里接受；你开口，代理也能替你建一个。
    contacts:
      name: 联系人
      tile: 一个与手机同步、知道谁是谁的通讯录。
      title: 知道谁是谁的通讯录
      body: 你保存的人，连同照片、生日和地址，与手机同步，你的代理也认得，所以“问问我爸爸”或“Sam 的新号码”都能找到对的人。
      more: 圈子是怎么工作的
      points:
        sync:
          title: 与手机同步
          body: CardDAV 让 iPhone 的通讯录保持同步，照片和生日都在；手机上的通讯录也可以从应用导进来。
        circles:
          title: 和你一起生活的人
          body: 圈子把家人或朋友的账号连在一起；在服务器上有账号的联系人会和账号关联，聊天或共享一点就到。
        card:
          title: "每个人一张卡片"
          body: "从聊天、圈子、照片或地图上打开任何人：他们和你是什么关系，他们与你分享的位置和健康，他们的照片，你们之间的邮件，以及他们发过言的会议。"
        sharing:
          title: "几乎什么都能共享"
          body: "日历、相册、位置、健康、财务账户、录音和圈子自己的通讯录，每样都按你选的程度共享，所有共享都集中在“共享”页面。"
        agent:
          title: 你的代理认得他们
          body: 它写信、排日程、归档时会查联系人，并在记忆里给每个重要的人留一页。
    photos:
      name: 照片
      tile: 你的照片库，从手机备份，按画面内容就能找到。
      title: 你的照片库，在你自己的服务器上
      body: 你的 iPhone 在后台备份照片库，「照片」页、应用和你的代理读的都是同一个照片库：按月份、按相册、按地点，也按照片里的人。人脸在你的服务器上识别，从不交给别处的服务。
      more: 照片是怎么工作的
    location:
      name: 位置
      tile: 你去过的地方，画在一天的地图上，只在你同意时共享。
      title: 你去过的地方，由你保管
      body: iPhone 应用记下你到访的地方，应用关着也记，你的服务器给它们起名，并把你的一天画在地图上。把你在哪儿分享给你选的人，也可以问代理你上次去某处是什么时候。
      more: 位置是怎么工作的
      points:
        visits:
          title: 每次到访，都在地图上
          body: 来自 iPhone 自带到访检测的到达和离开，以及每次待了多久。离线的一天，网络恢复后会完整传上来。
        places:
          title: 你起名的地点
          body: 家、公司、学校或健身房。你起的名字不会被替换，到达时还可以通知和你共享的人。
        paths:
          title: "路线、暂停与安静"
          body: "选中一位共享位置的人，地图上就画出他当天的路线。你可以暂停自己的记录一小时或到明天，静音某个人的到达提醒；有人到了你也在的地方时，你不会收到提醒。"
        agent:
          title: 它了解你的日常
          body: 问它你上次去牙医是什么时候，或者 Sam 到家了没有。一天、一段时间或全部，随时都能抹掉。
    health:
      name: 健康
      tile: 你的 Apple 健康数据，在你的服务器上画成图表，按类别共享。
      title: 你的健康，在你的服务器上
      body: iPhone 应用把你的 Apple 健康数据复制到你自己的服务器：步数、睡眠、心率、体能训练等等。仪表盘和应用把它画成图表，除非你共享，否则谁也看不到。
      more: 应用的隐私政策
      points:
        copied:
          title: 从 Apple 健康复制
          body: HealthKit 允许应用读取的一切，临床记录除外，存下就发过来。手机自己不另留副本。
        charts:
          title: 按天、按周、按年
          body: 步数、睡眠阶段、心率、体重和带路线的体能训练，在仪表盘、应用和命令行里都能看。
        sharing:
          title: 按类别共享
          body: 把「活动」或「睡眠」分享给你的圈子，他们看到的是每天的汇总，比如睡了七小时，看不到具体读数和你的路线。
        agent:
          title: 只有你允许，代理才读
          body: 默认关闭，打开后也只读你自己的。一段时间或全部，随时都能抹掉。
    coding:
      name: 编程
      tile: 每台电脑上的 Claude Code 和 Codex，它们的问题会送到你面前。
      title: 你的编程会话，在哪儿都能管
      body: 把你的 Claude Code 和 Codex 会话放在 herdr 里，你的代理就能看到你连接的每台电脑上的每一个会话。它们的问题会送到你所在的地方，每个会话一开始就知道你的代理知道的事。
      more: 编程会话是怎么工作的
      points:
        agents:
          title: "会话里的每个代理"
          body: "一个进行中的会话启动的代理，以树状显示在它下面，每个都写着它的任务、模型，以及是否还在运行。"
    knowledge:
      name: 知识
      tile: 你生活中的人、项目和地方组成的图谱，存在你的服务器上。
      title: 越来越懂你的记忆
      body: 你的代理知道的东西是一张由页面组成的图：人、项目、地方和事物，用说明关系的链接连起来。每条事实都有编号，带着它出处的原话，回答时可以引用；每次改动都记着是谁改的，你可以改回去。
      more: 记忆是怎么工作的
    recordings:
      name: 录音
      tile: 在手机上录下的会议，按说话人转写并总结。
      title: 会议，替你整理好
      body: 在 iPhone 上录下会议，你的代理会整理出来：边录边出的转写稿、按名字区分的说话人、做出了哪些决定的摘要，以及记进记忆里的收获。原始录音留在你的服务器上。
    finance:
      name: 财务
      tile: 账户、支出、预算、收据、净资产和报税年度。
      title: 你的钱，还有你的税
      body: 通过 Plaid 或 SimpleFIN 连接你的银行、信用卡和券商账户，或者导入对账单，就能看到钱花在哪儿、这个月的走向，以及加起来一共多少。这些记录存在你自己的数据库里，你的代理读的也是它们，所以直接问就行。
      more: 财务是怎么工作的
      points:
        taxes:
          title: 报税年度，替你拼好
          body: 从 PDF 或照片读出工资单、W-2、1099 和 1098，相互核对，再把全年加起来，算出你大概要补税还是退税。
    shopping:
      name: "购物"
      tile: "共享清单，在店里实时勾选，收据一到自动划掉。"
      title: "全家共用的购物清单"
      body: "建立“日用品”“五金”之类的清单，与你的圈子共享。到了店里，你逛的是这家店，而不是某张清单：所有清单在这家店要买的东西，按货架排好。其他人能实时看到购物车装满，收据会把买到的东西划掉。"
      more: "购物清单如何运作"
      points:
        live:
          title: "实时勾选"
          body: "你放进购物车的第一件商品会告诉其他人你在购物，每次勾选都会立即出现在他们的屏幕上。点“完成”即把购物车里的东西算作买好。"
        receipts:
          title: "收据帮你收尾"
          body: "无论来自照片、邮件还是发给助手的收据，都会划掉买到的东西，并记下在这家店的价格。不确定的匹配会等你确认，也可以撤销。"
        arrive:
          title: "到店就提醒"
          body: "一到某家店，手机就告诉你清单在这里还需要什么。"
        pictures:
          title: "图片和价格"
          body: "每件商品通过你的服务器在网上找到图片，并记住它在每家店历来的价格。"
        agent:
          title: "告诉助手就行"
          body: "说一句“把鸡蛋和大米加到日用品里”，或发一张手写清单的照片，东西就加上了。"
    payments:
      name: 付款
      tile: 你的代理替你付款，在你设的限额内，每一笔都要你点头。
      title: 付款，每一笔都由你点头
      body: 你的代理通过运行在你自己电脑上的付款技能（比如 Link）付款，从来看不到卡号。可以带着限额借给家里人用，超出限额的会等你决定。
      more: 共享是怎么工作的
      points:
        agent:
          title: 它来付，你来确认
          body: 技能以你的身份运行在你的电脑上，每一笔付款还要在付款应用里等你确认。
        share:
          title: 和家人共享
          body: 把付款工具借给圈子里的人。他们的代理在你的电脑上用它付款，但读不到你的余额和交易记录。
        limits:
          title: 你设的限额
          body: 单笔最多多少、每月最多多少。超出限额的，或者服务器读不出金额的，都会等你决定。
        approve:
          title: 在哪儿都能批准
          body: 抽屉里的一张卡片和手机上的一条通知，写着金额和对方代理的留言。给孩子可以设成每次都问我。
    passwords:
      name: "密码"
      tile: "登录信息、通行密钥和验证码，在你的设备上加密，代理只在你允许的地方使用。"
      title: "连你的服务器都读不了的密码"
      body: "登录信息、通行密钥、一次性验证码、卡片和备注，在到达你的服务器之前就已在你的手机或浏览器里加密，所以服务器和运维它的人都读不了。在 Chrome 和 iPhone 上自动填充，与圈子共享，并让你的代理用你挑选的几个登录信息替你登录。"
      more: "密码是怎么工作的"
      points:
        sealed:
          title: "在你的设备上加密"
          body: "只有你知道的口令能打开它们，之后在 iPhone 上用面容 ID。服务器、备份和代理看到的都是密文，连网站和用户名也是。"
        fills:
          title: "在你登录的地方填好"
          body: "Chrome 扩展会填充登录信息、保存新的登录，并生成密码和通行密钥。在 iPhone 上，TeaNode 能在 Safari 和其他所有应用里自动填充，一次性验证码也包括在内。"
        share:
          title: "与圈子共享"
          body: "把一个登录信息给圈子里的某个人或整个圈子。它只为他们的设备加密，也只有你能修改它。"
        agent:
          title: "代理替你登录，却读不到"
          body: "为某一个登录信息打开「允许助手使用此项目」，代理就能在你发起的对话里，只在这个登录信息自己的网站上用它登录。密码直接填进网页，从不交给模型。"
        import:
          title: "随身带过来"
          body: "可以从 Chrome、Apple 密码、Bitwarden 或 pass 导入，也随时能再导出。"
  yours:
    heading: 属于你，只属于你
    lead: 一个能触及你生活方方面面的代理，只有在你的生活仍然属于你时才值得拥有。TeaNode 运行在你自己的硬件上，所有东西都存在你自己的数据库里，你没有打开的，它一样也不做。
    points:
      hardware:
        title: 在你的硬件上
        body: "在你自己的机器上运行一个程序和一个 PostgreSQL。你的邮件、照片、健康和财务都存在那里，在我们这里没有任何账户；你的密码在你自己的设备上加密，连服务器都读不了。"
      model:
        title: 模型由你选
        body: 托管的模型只会收到一次对话所需的内容。接上你自己的 Ollama 或 vLLM，就什么都不会离开这台机器。
      say:
        title: 不经你同意，什么都不做
        body: 每个部分都默认关闭，代理只碰你授权的东西，任何无法撤销的操作之前都会停下来等你点头。
      open:
        title: 开源，永远归你
        body: MIT 许可，每一行代码都在 GitHub 上。备份、导出、抹掉任何部分，或者关掉它，都由你。
  phone:
    heading: TeaNode iPhone 应用
    lead: 你的助手，放进口袋。
    body: 和它聊天，给它打电话，在通知里直接回复它，从任何应用把你正在看的东西交给它。一个应用对应每一台 TeaNode 服务器：扫一下仪表盘上的二维码，它就以你的身份连上，什么都不用输入。仪表盘能做的它都能做，从邮件、日历到照片、财务和知识，用的是系统自己的控件，跟随你的字号。
    availability: 现已在 TestFlight 测试，即将上架 App Store
    privacy: 应用的隐私政策
    galleryLabel: iPhone 应用的界面，数据均为虚构
    points:
      chat:
        title: 对话，随时随地
        body: 仪表盘抽屉里的每一种卡片都在，包括编程会话提出的问题和作为按钮的选项。在一封邮件、一笔扣款或一个页面上，直接就地问它。
      notify:
        title: 在通知里回复
        body: 需要你的事以通知的形式到来，可以直接回复。正在进行的一轮会作为实时活动留在锁屏上，小组件显示什么在等你、接下来是什么。
      call:
        title: 打电话，或者问 Siri
        body: 一通真正的电话，可以随时插话，用扬声器或耳机都行。「问 TeaNode」和「呼叫 TeaNode」可以从 Siri、快捷指令和控制中心使用。
      share:
        title: 什么都能分享给它
        body: 一张图片、一个文件、一个链接或几句话，连同一条备注交给你的代理。工资单和 W-2 直接进「税务」，银行导出的文件进对账单。
      record:
        title: 录下一场会议
        body: 手机负责录音，服务器边收边转写；网络断掉的上传，会从断开的地方接着传。
      photos:
        title: 照片，自动备份
        body: 照片库在后台传到你的服务器，网络断了就从断开的地方接着传。在手机上删掉的照片，在 TeaNode 上还在。
      location:
        title: 你去过哪里
        body: 应用关着的时候也会记下你到访的地点，画成一天的地图，只和你选定的人共享。
      search:
        title: "搜索一切"
        body: "搜索标签页同时查对话、邮件、联系人、照片和其他一切，你最常用的三个部分放在标签栏里。"
      shopping:
        title: "在店里购物"
        body: "清单按商店和货架排好，和其他人一起实时勾选，到店时还会提醒你。"
      journal:
        title: "你的日记"
        body: "一点就记下今天的心情，写下你的文字，看 TeaNode 眼中的每一天，以及上面的周和月。"
      passwords:
        title: "你的密码，在每个应用里"
        body: "TeaNode 是一个自动填充提供者：Safari 和其他应用会提供它的登录信息、通行密钥和一次性验证码，用面容 ID 打开。"
      setup:
        title: 邮件、日历和联系人也一样
        body: 一个描述文件就把你的邮箱、日历和联系人加进 iPhone 自带的应用；你的通讯录也可以从手机导入。
    captions:
      conversation: 对话：一封起草好的邮件、一个编程会话的提问，还有一条等你点头的回复。
      chats: "和 Sam 的聊天：链接显示得又短又干净，下面附一张它指向的网页的卡片。"
      mail: 收件箱，重要的和需要回复的都有标记。
