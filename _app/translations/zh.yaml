      calendar: 一整个月，提醒事项点一下就到。
      finance: 钱花到了哪里，一个月一个月地看。
      recording: 一场录下的会议：先是摘要，然后是按发言人分开的文字稿。
      knowledge: 记忆里一个人的页面，连着与之相关的邮件、日程和收据。
      contacts: 通讯录，与服务器保持同步。
