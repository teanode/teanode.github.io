welcome:
  headline: 自己的域名，已经在用的邮箱。
  lead: >-
    TeaNode 是一个开源邮件服务器，让每个副业项目和早期创业公司都有一个自己域名下的真实地址。
    它接收邮件，验证邮件是否真实，然后转发到你已经在读的邮箱，或者一个 webhook。回复以域名的身份签名发出，
    真正送达，而不是落进垃圾箱。没有邮箱，也没有 IMAP：你现在在哪里读邮件，就继续在哪里读。
