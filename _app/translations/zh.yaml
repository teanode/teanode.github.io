  features:
    authenticates:
      title: 验证每一封邮件
      body: 进来时检查 SPF、DKIM、DMARC 和 ARC，出去时签名。
    forwards:
      title: 灵活转发
      body: 用模式把每个地址送到邮箱、webhook 或另一台服务器。
    relays:
      title: 用自己的地址发信
      body: 每台设备一份 SMTP 凭据，可以限制为只用一个发件地址。
    shows:
      title: 让你看到邮件
      body: 每一封邮件的判定和投递尝试，正文安全地渲染。
    sends:
      title: 发送你写的邮件
      body: 带变量和翻译的模板，外面套一个版式。
    reports:
      title: 报告你的域名状况
      body: 解析并保存 DMARC 报告，让你看到谁在以你的域名发信。
  startHeading: 开始使用
  startLead: 用 docker compose 执行四条命令，然后打开仪表盘。
  startAfter: >-
    第一个访问仪表盘的人创建账户。在那里添加你的域名，它会列出要发布的 DNS 记录。
  startWalkthrough: 快速开始
  needHeading: 你需要什么
  needs:
    domain: 一个你能编辑 DNS 的域名。
    host: 一台地址稳定、开放 25、80、443 和 587 端口的主机。
    docker: 带 compose 的 Docker。PostgreSQL 随 compose 文件一起。
  needsAfter: 别的什么都不需要。不需要云账号，不需要 DNS API，证书自动获取。
  questionsHeading: 常见问题
  questions:
    port25:
      question: 我需要开放 25 端口吗？
      answer: >-
        接收邮件需要：其他邮件服务器通过 25 端口投递，没有别的入口。大多数家庭宽带会封锁它，
        大多数小型服务器不会。见[25 端口的问题](/doc/getting-started#25-端口的问题)。
    reply:
      question: 我能在 Gmail 里回复吗？
      answer: >-
        可以。在仪表盘里创建一份 SMTP 凭据，然后在 Gmail 的“用这个地址发送邮件”里添加该地址，
        发件服务器填 TeaNode。回复会带着你域名的密钥签名发出。
    outbound:
      question: 我的主机封锁了外发 25 端口，还能发信吗？
      answer: >-
        可以。把中继设置指向某个服务商的提交端口：Amazon SES、Postmark、Resend 或一个 Gmail 账号都可以，
        邮件保留 TeaNode 加上的签名。见[中继](/doc/configuration#smtprelay)。
    stored:
      question: 它会保留我的邮件吗？
      answer: >-
        邮件会在磁盘上保留你设定的时长，这样仪表盘能展示它们，失败的投递也能重试，之后被删除。
        把保留时长设为零则永久保留。
