        calendar: 9 月 14 日至 18 日
        drafted: 一封给 Grace Hopper 的回信
        invoices: 7 笔里有 2 笔未结
        contact: Osborne & Sons
        tracking: 承运商的通知
        saved: ~/Documents/receipt.pdf
      reply:
        today: 三件事。Grace 在等合同的答复，要赶在你那个电话之前——第 7 条从六十天改成了九十天。Katherine 的董事会数字需要核对留存率。Radia 请你读一份草稿，那个可以等到今天晚上。
        thursday: 两点以后有空。九点半站会，之后一直到四点的合同评审之前都没别的。
        unpaid: 两笔。Osborne & Sons，4,200 英镑，逾期三十一天。Halliday，980 英镑，逾期八天——那一笔还在你们约定的账期之内。
        chase: 写好了，在草稿里等着。语气客气，写明了发票号和日期，也没有提到第二笔。
        parcel: 已经在派送途中，预计六点前到。承运商今天早上七点半写来的；那封邮件在归档里，被分类为通知。
        file: 存好了。它是一个 PDF，所以我把它留给你，而不是念给你听——你打开它，然后告诉我，我就能接着做。
      card:
        send: 给 Grace Hopper 发出「周四四点可以」？
        remind: 把催款寄给 Osborne & Sons？
  voice:
    heading: 给它打电话
    lead: 按下聊天抽屉里的电话，或者从 iPhone 应用打给它，开口说话。你每说完一段，就作为一轮发给你的代理，而回答一边写，一边读给你听。
    body: 它在任何一页上都能用，笔记本和手机上都行，说出来的一轮能用到打字时能用的每一个工具。说过的话留在对话里，所以你可以挂断电话接着打字。
    more: 语音是怎么工作的
    points:
      call:
        title: 马上就回应
        body: 查之前它先说一声在查，你说得很长的时候，它会像听的人那样发出简短的应和声。
      ear:
        title: 写给耳朵听的
        body: 先说答案，几句短句，数字按人平常的说法来说，在根据一个可能听错的名字行动之前先确认一遍。
      cutIn:
        title: 想插话就插话
        body: 一开口，回答的声音就低下去，然后停下。代理会被告知你听到了多少。
      key:
        title: 密钥留在服务器上
        body: 抽屉和你的服务器说话，你的服务器再和提供方说话。通话也算在同样的每日限额里。
  coding:
    points:
      sees:
        title: 每一个会话，每一台电脑
        body: 工作中、空闲或在提问，带着目录和标题，在「连接」标签上，也在命令行里。
      types:
        title: 在你看得到的地方输入
        body: 只有一个进程、一份历史、一块屏幕，由你和代理共用。你随时都可以接手。
      asks:
        title: 它们的问题来找你
        body: "手机会收到通知，点开即在编程页面打开那个会话，选项就是按钮。谁先回答算谁的，过时的回答会被拒绝。"
      page:
        title: 它们自己的一页
        body: 仪表盘的「编程」页和 iPhone 应用实时显示每个会话的记录或屏幕，下面有写下一条提示的输入框，还能在旁边开一个新标签。
      remembers:
        title: 它们知道你的代理知道的事
        body: 装上 teanode hook 之后，一个会话一开始就看到项目的页面和上一个会话停在哪里，每次提示也会带上它从这个项目里想起的东西。
      anywhere:
        title: 任何会说 MCP 的都行
        body: ChatGPT、Grok、一个编辑器，或者抽屉里的一通电话。告诉一个会话接下来做什么，或者让它做完时通知你。
  mcp:
    heading: 也可以从你的编辑器里用，或者从你的手机上
    lead: TeaNode 会应答 Model Context Protocol，所以一个写代码的工具、一个编辑器，或者 ChatGPT、Grok 这样的聊天助手，可以用你代理的那些工具，也可以直接问你的代理问题。
    body: 把一个程序指向这个地址，然后在浏览器里批准它，哪里都不用复制令牌。它拿到的是你的权限所允许的，减去运维者关掉的那些，所以一个不能读邮件的人不会被给到邮件搜索；它拿到的令牌也只对代理的工具有效。设置里的「应用」可以断开它。用一句话问它，回答背后是它关于你的记忆，而不用你自己去调用六次。
  people:
    points:
      chats:
        title: 聊天，带不带代理都行
        body: 私聊和群聊就在你的代理对话旁边，可以发图片、回复和表情回应。别人的代理只有在主人允许时才会回答你。
      calendars:
        title: 一个大家都能看的日历
        body: 按忙闲、标题、详情或可编辑来共享你的日历，给圈子建一个共同的日历，再找一个大家都合适的时间。私人日程只显示为忙。
      location:
        title: 每个人在哪里
        body: 共享你现在在哪里，或者连同去过哪里一起共享；有人到家时你会知道。和你共享的人在实时地图上看到你。
      relationships:
        title: 谁是谁
        body: 说 Sam 是你的父亲，Sam 那边就看到你是 Sam 的孩子。只有你们两个看得到，你的代理也就明白「问问我爸爸」指的是 Sam。
  photos:
    points:
      backup:
        title: 在后台备份
        body: 默认只用 Wi-Fi，除非你允许用移动数据；实况照片和编辑都包括在内，网络断了就从断开的地方接着传。在手机上删掉的照片，在 TeaNode 上还在。
      find:
        title: 按画面内容找到
        body: 按地点、日期或相机搜索，或者问你的代理要去年夏天在湖边拍的照片。它需要时才看一张照片，并记住看到了什么。
      people:
        title: 由你命名的人
        body: 人脸在你自己的服务器上归组，用你通讯录里的联系人命名。你的代理从不靠猜来给一张脸起名。
      albums:
        title: 和别人共享的相册
        body: 共享给圈子里的某个人或整个圈子，可以只看，也可以往里添照片，并选择带不带拍摄地点。
      places:
        title: 改正拍摄地点
        body: 一张或五百张照片的拍摄地点都能修改或删除，城市列表就在服务器上，不用去问任何地图服务。
  finance:
    points:
      linked:
        title: 接入，或者导入
        body: SimpleFIN 用你自己的设置令牌，Plaid 用运维者的密钥。哪个服务商都接不上的卡，可以从对账单文件或截图导入。
      categories:
        title: 你自己的类别
        body: 由你、你的规则、银行的类别来归类，最后才轮到模型。选中一页交易，一次就把它们连同它们的商户一起归好类。
      receipts:
        title: 收据，逐行记下
        body: 在聊天里拍下来，或者以邮件寄来，和印出的合计核对，并对应到那笔扣款上，所以你可以搜到自己买过什么。
      budgets:
        title: 往前看的预算
        body: 每一项都说明这个月正往哪里走，还没来的账单也算在内。储蓄目标说明每月需要多少。
      netWorth:
        title: 净资产
        body: 账户、持仓、房子和车，任何币种都行，你允许的地方由代理来估价。
  meetings:
    points:
      live:
        title: 边录边转写
        body: 录音进行时，各个片段并行转写，所以一场长会不需要长时间等待。
      speakers:
        title: 谁说了什么
        body: 给一个发言人起一次名，每段话都会跟上。只剩没人起过名的发言人需要问你，口头禅和填充词会被略去。
      corrections:
        title: 你的改动会留下
        body: 文字稿的每一个版本都会保留，之后的处理永远不会撤销你改过的那一句。
      memory:
        title: 进入记忆
        body: 决定、日期和承诺会落到它们所属的页面上，并引用这段录音。
  memory:
    sourcesLead: 你指给它之后，它会去读的地方
    sources:
      checkout: 你电脑上的一个代码检出
      archive: 一份聊天存档
      notes: 你的笔记
      wiki: 通过技能接入的 wiki
      web: 你指定的一个网站
      sent: 你自己发出去的邮件
    points:
      writes:
        title: 不用你开口，它自己写
        body: 一次对话安静下来之后，有一个任务会把这次对话教给它的东西记下来，所以你周二说过的话，周三还在。第一版是让模型在回合中自己去写；456 个回合里它只写了两条，而且都是测试。给一个模型一个任务和一个记忆工具，它会去做那个任务。
      reads:
        title: 它读你本来就有的东西
        body: 把它指向一个代码检出、一份聊天导出，或者一个按日期记的笔记文件夹，它就会保留一份可以搜索、可以引用的副本。遍历、判别和拒绝都发生在文件所在的那台机器上，所以密钥和口令不会经过网络。它读过的东西你自己也能搜，不用问它，也不用为一轮对话付钱。
      dreams:
        title: 你睡着的时候它在收拾
        body: 在你设定的时段里，在你安静了一会儿之后，它读新到的东西，写这个月的记录，重写有变动的页面，把长得太大的页面拆开，并在图上游走，寻找没人写下来的联系。然后它把你明天可能会问的问题拿来问自己，并记下它答不上来的那些。
  featuresHeading: 它能做什么
  features:
    mailbox:
      title: 每个账户都有一个邮箱
      body: 可以嵌套的文件夹、覆盖全部邮件的搜索、规则、草稿、签名、外出自动回复，以及键盘快捷键。
    imap:
      title: 任何邮件程序都能用的 IMAP
      body: 在任何地方读同一个邮箱。每台设备一份应用专用密码，也能用它在提交端口发信。
    authenticates:
      title: 验证并打分
      body: 进来时检查 SPF、DKIM、DMARC 和 ARC，出去时签名，垃圾邮件由内建的过滤器打分。
    forwards:
      title: 灵活转发
      body: 用模式把每个地址送到邮箱、别处的收件箱、webhook 或另一台服务器。
    calendar:
      title: 日历、提醒事项、备忘录和通讯录
      body: 你的手机通过 CalDAV、CardDAV 和 IMAP 让它们保持同步，用它已经有的那份应用专用密码登录：它的日历、提醒事项、备忘录和通讯录。邀请以邮件的形式来，也以邮件的形式去。
    subscriptions:
      title: 每一个邮件列表，以及离开的办法
      body: 订阅信有自己的一页。按发信人自己说的方式退订，或者静音它，让它自己归档。
    marks:
      title: 发信人旁边的标志
      body: 显示域名为自己的邮件发布的图标，只对通过 DMARC 的邮件显示。也帮你发布自己的。
    access:
      title: 人员、群组和角色
      body: 权限决定每个人能看到什么，单点登录跟随你的目录，每一次改动都有记录。
    shows:
      title: 让你看到每一封邮件
      body: 判定、投递尝试，以及关于你的域名的 DMARC 报告。
  extrasLead: 还有，需要时可以打开
  extras:
    templates: 模板和版式
    cli: 命令行客户端
    clamav: ClamAV
    spamd: 外部 SpamAssassin
    geoip: GeoIP
    s3: S3 镜像
    socks5: SOCKS5 代理
    dns01: DNS-01 证书
  startHeading: 开始使用
  startLead: 只要助手的话一条命令就够了，想要自己的邮件时再加上。
  start:
    assistant:
      title: 只要助手
      note: 不需要域名，也不需要邮件端口。它监听 127.0.0.1:8080；要从手机访问，在它前面放一个 HTTPS 反向代理。
      after: 打开仪表盘，创建账户，再粘贴一个模型密钥。
    mail:
      title: 带上你自己的邮件
      note: 在你的域名上收发邮件，助手和上面的一切也都在。
      after: 第一个访问仪表盘的人创建账户。在那里添加你的域名，它会列出要发布的 DNS 记录。
  startWalkthrough: 快速开始
  closingHeading: 准备好了就开始
  closingLead: 一条命令、一个账户、一个模型密钥。在全新的服务器上大约一分钟。
  startSteps: 每一步，配图说明
  needHeading: 你需要什么
  needs:
    host: 一台一直开着的电脑。在 Linux 上安装命令会带上 Docker，PostgreSQL 也一起装好。
    model: 一个用来思考的模型。一个 API 密钥、一个你已经在付费的 ChatGPT 套餐，或者你自己的 Ollama 或 vLLM。
    https: 为了 iPhone 应用和出门在外时使用，在它前面放一个 HTTPS 地址，任何反向代理都行。
    mail: 如果要自己的邮件，还需要一个你能编辑 DNS 的域名，并开放 25、80、443、587 和 993 端口。
  needsAfter: 不需要在我们这里注册账号，因为我们这里根本没有可注册的东西。发到应用的通知会经过一个中继，它只看得到调用它的服务器地址，以及一段它读不了的内容。
  questionsHeading: 常见问题
  questions:
    family:
      question: 我的家人也能用吗？
      answer: 能。每个人在同一台服务器上都有自己的账户，想要的话还有自己的邮箱和代理。把他们放进一个圈子，就能一起聊天、共享日历和相册、看到每个人在哪里，每个人只共享自己选的东西。见[圈子与聊天](/doc/circles)。
    mailserver:
      question: 我一定要运行邮件服务器吗？
      answer: 不用。助手可以单独运行，不需要域名、MX 记录或邮件端口，日历、提醒事项和联系人也是各自独立的选择。之后可以在「服务器」的「设置」里加上托管邮件，已有的东西都会保留。
    app:
      question: iPhone 应用上架 App Store 了吗？
      answer: 还没有。它正在 TestFlight 里测试，即将上架 App Store，是一个可以连接任何 TeaNode 服务器的应用。在那之前，可以用你自己的开发者账号，从仓库的 `ios` 目录自行构建。
    model:
      question: 它用哪个模型，谁会看到我的数据？
      answer: 用你的服务器指向的那个：OpenAI、Anthropic、Gemini、一个 ChatGPT 套餐，或者你自己硬件上的 Ollama 或 vLLM。你的代理读到的内容只会发给那个模型，不会去别处；用本地模型的话，什么都不离开这台机器。运维者可以给每个人能花多少设上限。
    port25:
      question: 我需要开放 25 端口吗？
      answer: 接收邮件需要：其他邮件服务器通过 25 端口投递，没有别的入口。大多数家庭宽带会封锁它，大多数小型服务器不会。见[25 端口的问题](/doc/getting-started#25-端口的问题)。
    mailprogram:
      question: 我能用自己的邮件程序读吗？
      answer: 可以。服务器在 993 端口提供 IMAP，在 143 端口提供 STARTTLS。在邮箱设置里为这台设备创建一份应用专用密码，Apple Mail、Thunderbird 或你的手机就能用你的地址和这份密码登录。同一份密码也能在 587 端口发信。
    forwarding:
      question: 我一定要用邮箱吗？
      answer: 不一定。一个别名可以投递进邮箱、转发到你已经在读的地址、发到一个 webhook，或者交给另一台邮件服务器，同一个域名四种都能同时用。
    outbound:
      question: 我的主机封锁了外发 25 端口，还能发信吗？
      answer: 可以。把中继设置指向某个服务商的提交端口：Amazon SES、Postmark、Resend 或一个 Gmail 账号都可以，邮件保留 TeaNode 加上的签名。见[中继](/doc/configuration#smtprelay)。
    team:
      question: 我的团队能用公司的身份提供商登录吗？
      answer: 可以，通过 OpenID Connect。一个群组可以跟随你目录里的一个群组，角色决定它的成员能看什么、做什么；绑定到一个域名的群组，权限就只到那里为止。
    stored:
      question: 我的邮件存放在哪里？
      answer: 在你的主机上，在你的 PostgreSQL 数据库里，原始邮件放在磁盘上或你选择的对象存储里。一封邮件只存一份，无论有多少个文件夹放着它，只要还有一个放着就一直保留。
start:
  title: 开始使用
  headline: 你自己的助手，大约一分钟就能跑起来。
  lead: >-
    在一台一直开着的电脑上运行一条命令，创建一个账户，再填一个模型服务的密钥。视频在一台全新的服务器上演示了全过程；下面是同样的步骤，一步一步来。
  videoLabel: 在一台全新的服务器上安装 TeaNode，从命令到助手的第一句回答
  steps:
    install:
      title: 运行一条命令
      body: >-
        在要运行 TeaNode 的电脑上：一台 Linux 服务器、一台闲置的电脑，或装了 Docker Desktop 的 Mac。在 Linux 上缺 Docker 时它会先装上，然后启动 TeaNode 和它的数据库，等到仪表盘能打开为止。
      note: >-
        所有东西都放在 /opt/teanode（不是 root 时放在 ~/teanode），只监听 127.0.0.1:8080。想先看看脚本，可以打开 teanode.com/get.sh；再运行一次不会丢数据。
      picture: 安装命令运行完的终端，显示 TeaNode 已在运行
    account:
      title: 创建你的账户
      body: >-
        在浏览器里打开 http://127.0.0.1:8080，选一个用户名和密码。第一个访问的人就是管理员，所以马上去做。
      note: >-
        TeaNode 在服务器上，而不是你面前这台电脑？先在你自己的电脑上运行上面的隧道命令，再打开同一个地址。
      picture: 仪表盘的创建账户表单，填好了用户名和密码
    key:
      title: 粘贴模型密钥
      body: >-
        选 OpenAI、Anthropic 或 Gemini，粘贴它的 API 密钥；或者选“你自己的服务器”，用你的 Ollama 或 vLLM。按“启动我的助手”：它会检查密钥、选一个好模型，然后启动助手。
      note: >-
        每个服务旁边都有获取密钥的链接。密钥只留在你的服务器上。已经付费的 ChatGPT 套餐则在“管理”里登录。
      picture: 欢迎页选了 OpenAI、粘贴了密钥，以及“启动我的助手”按钮
    hello:
      title: 打个招呼
      body: >-
        对话会自动打开，助手先做自我介绍。问它什么都行，它会边聊边了解你。
      note: >-
        邮件、日历和联系人随时可以在“管理 → 服务器 → 设置”里加上。
      picture: 聊天面板里助手的第一条消息
  nextHeading: 接下来
  next:
    phone: 在前面放一个 HTTPS 地址，用 iPhone 访问它
    mail: 加上你自己域名的邮件
    docs: 阅读文档
footer:
  licence: 以 MIT 许可证开源。
  security: 报告安全问题
