welcome:
  headline: 一个住在你自己服务器上的私人助手。
  lead: 它读你的邮件，管你的日历，归档你的收据和报税表格，整理你的会议，留意你的编程会话，并且记住它对你的了解。用 iPhone 应用、浏览器或者一通电话和它说话。一个程序、一个 PostgreSQL，跑在你的硬件上；把它指向你自己的 Ollama 或者 vLLM，就没有任何东西离开这台机器。
  getStarted: 开始使用
  iphoneButton: iPhone 应用
  lifeHeading: 它替你照看什么
  life:
    mail:
      title: 你的邮件
      body: 给到达的邮件分类，告诉你什么在等你，再用你的口吻写好回复。发不发由你决定。
    days:
      title: 你的日子
      body: 日历、提醒事项、备忘录和通讯录，手机会和它们保持同步；邀请在对话里就能答复。
    money:
      title: 你的钱
      body: 接入或导入银行、信用卡和证券账户，按你的方式归类支出，预算会往前看，收据对上它的那笔扣款。
    taxes:
      title: 你的税务
      body: 从 PDF 或照片读出工资单、W-2、1099 和 1098，把一整年加起来，算出你大概要补多少税、能退多少。
    meetings:
      title: 你的会议
      body: 在 iPhone 上录音，边录边出文字稿，发言人有名有姓，摘要归到该去的地方。
    memory:
      title: 你告诉过它的事
      body: 一份关于你生活里的人、项目和地方的记忆。它在你们说话时写下，回答时引用，在梦里整理。
    coding:
      title: 你的编程会话
      body: 每台电脑上的 Claude Code 和 Codex。它们的问题会来找你，而它们一开始就知道你的代理知道的事。
    computer:
      title: 你的电脑和浏览器
      body: 你接上的机器上的文件、终端和浏览器；任何撤不回的事，都先问过你。
  phone:
    heading: TeaNode iPhone 应用
    lead: 你的助手，放进口袋。
    body: 和它聊天，给它打电话，在通知里直接回复它，从任何应用把你正在看的东西交给它。一个应用对应每一台 TeaNode 服务器：扫一下仪表盘上的二维码，它就以你的身份连上，什么都不用输入。仪表盘能做的它都能做，从邮件、日历到财务和知识，用的是系统自己的控件，跟随你的字号。
    availability: 现已在 TestFlight 测试，即将上架 App Store
    privacy: 应用的隐私政策
    galleryLabel: iPhone 应用的界面，数据均为虚构
    points:
      chat:
        title: 对话，随时随地
        body: 仪表盘抽屉里的每一种卡片都在，包括编程会话提出的问题和作为按钮的选项。在一封邮件、一笔扣款或一个页面上，直接就地问它。
      notify:
        title: 在通知里回复
        body: 需要你的事以通知的形式到来，可以直接回复。正在进行的一轮会作为实时活动留在锁屏上，小组件显示什么在等你、接下来是什么。
      call:
        title: 打电话，或者问 Siri
        body: 一通真正的电话，可以随时插话，用扬声器或耳机都行。「问 TeaNode」和「呼叫 TeaNode」可以从 Siri、快捷指令和控制中心使用。
      share:
        title: 什么都能分享给它
        body: 一张图片、一个文件、一个链接或几句话，连同一条备注交给你的代理。工资单和 W-2 直接进「税务」，银行导出的文件进对账单。
      record:
        title: 录下一场会议
        body: 手机负责录音，服务器边收边转写；网络断掉的上传，会从断开的地方接着传。
      setup:
        title: 邮件、日历和联系人也一样
        body: 一个描述文件就把你的邮箱、日历和联系人加进 iPhone 自带的应用；你的通讯录也可以从手机导入。
    captions:
      conversation: 对话：一封起草好的邮件、一个编程会话的提问，还有一条等你点头的回复。
