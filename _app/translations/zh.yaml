    note: >-
      以 2026 年 9 月各家方案为准。方案会变，许可不会。
  featuresHeading: 它能做什么
  features:
    authenticates:
      title: 验证每一封邮件
      body: >-
        进来的邮件经过 SPF、DKIM、DMARC 和 ARC 检查，按邮件逐一显示。外发邮件带 DKIM 签名，
        转发的邮件带 ARC 链，到了对方那里依然能通过验证。
    forwards:
      title: 灵活转发
      body: >-
        别名用模式匹配地址，转发到一个邮箱地址、一个 webhook 或另一台邮件服务器。
        兜底别名接收其他别名都没有匹配到的邮件。
    relays:
      title: 用自己的地址发信
      body: >-
        为每台设备配一份 SMTP 凭据，你的手机、电脑和应用程序就能以你的任何域名发信。
        凭据可以限制为只用一个发件地址。
    shows:
      title: 让你看到邮件
      body: >-
        每一封邮件的判定、投递尝试，以及去掉脚本的正文，远程图片在你要求之前不会加载。
    sends:
      title: 发送你写的邮件
      body: >-
        带变量和翻译的模板、包在外面的版式，以及从你自己的域名提供的图片。
    reports:
      title: 报告你的域名状况
      body: >-
        收到的 DMARC 汇总报告会被解析并保存，这就是你发现有人伪造你的域名的方式。
  featuresAlso: >-
    仪表盘内建在服务器里，命令行客户端可以从任何地方访问同一套 API。ClamAV、SpamAssassin、GeoIP、
    存储邮件的 S3 镜像、外发 SOCKS5 代理和 DNS-01 证书在你需要时都在，不需要时全部关闭。
  startHeading: 开始使用
  startLead: 用 docker compose 执行四条命令，然后打开仪表盘。
  startAfter: >-
    第一个访问仪表盘的人创建账户。在那里添加你的域名，它会列出要发布的 DNS 记录。
  startWalkthrough: 快速开始
  needHeading: 你需要什么
  needs:
    domain: 一个域名，以及编辑它的 DNS 的能力。
    host: 一台地址稳定的主机，25、80、443 和 587 端口可以访问。
    docker: 带 compose 的 Docker。compose 文件会替你启动 PostgreSQL。
  needsAfter: >-
    别的什么都不需要。不需要云账号。证书通过 HTTP-01 自动获取，
    所以没有 DNS API 需要配置。
  questionsHeading: 常见问题
  questions:
    port25:
      question: 我需要开放 25 端口吗？
      answer: >-
        接收邮件需要：其他邮件服务器通过 25 端口投递，没有别的入口。大多数家庭宽带会封锁它，
        大多数小型服务器不会。见[25 端口的问题](/doc/getting-started#25-端口的问题)。
    reply:
      question: 我能在 Gmail 里回复吗？
      answer: >-
        可以。在仪表盘里创建一份 SMTP 凭据，然后在 Gmail 的“用这个地址发送邮件”里添加该地址，
        发件服务器填 TeaNode。回复会带着你域名的密钥签名发出。
    outbound:
      question: 我的主机封锁了外发 25 端口，还能发信吗？
      answer: >-
        可以。把中继设置指向某个服务商的提交端口：Amazon SES、Postmark、Resend 或一个 Gmail 账号都可以，
        邮件保留 TeaNode 加上的签名。见[中继](/doc/configuration#smtprelay)。
    stored:
      question: 它会保留我的邮件吗？
      answer: >-
        邮件会在磁盘上保留你设定的时长，这样仪表盘能展示它们，失败的投递也能重试，之后被删除。
        把保留时长设为零则永久保留。
