  screenshots:
    mailbox: 邮箱。可以嵌套的文件夹、覆盖全部邮件的搜索，以及像邮件程序那样呈现的邮件。
    payments: 借给圈子里某个人的付款技能，带着限额，以及通过它发起的每一次调用。
    drawerPayment: Sam 的代理要付的金额超出了 Robin 设的限额，所以等 Robin 决定，附上金额和 Sam 的留言。
    recording: 一场录下的会议：先是做出了哪些决定的摘要，然后是按说话人分段的转写稿。
    coding: "编程页面。一个会话在问用哪种存储，选项就是按钮，下面有回答框。"
    health: 健康。来自 iPhone 的步数、睡眠、心率和体能训练，可以按天看，也可以看全年。
    photoAlbums: 相册：手动建的，或从服务器建议的旅行中建的，还有和圈子共享的。
    followups: 代理正在跟进的邮件事项：账单、包裹和截止日期，付了、到了或办完了就自动关掉。
    chatAgent: 对话：你的代理和圈子里的人在同一个列表里，旁边开着代理的对话。它查看过什么，都列在每个回答上方。
    priority: 优先：代理认为正在等你的东西，就在「星标」旁边。行上的标签是它给的类别、优先级，以及是否有人需要答复。
    calendar: 日历，按周看，提醒事项就在旁边的标签页里。你的手机通过 CalDAV 让两者保持同步，而以邮件形式到达的邀请会变成一个你可以答复的事件。
    drawerMail: 每一页上都有的聊天抽屉。问起包裹和学校的邮件，代理会搜索你的邮件，回答里附上它读过的邮件的链接。
    drawerCalendar: 同一场对话，又问了一句。它读了两个人的日历和学校的来信，给出你和 Sam 都方便的时间，并在写任何东西之前先问你。
    photos: 照片。照片库按月或全部显示，来自手机备份、在这里上传或从对话里保存，相册和照片里的人点一下就到。
    photoViewer: 一张照片，连同它是什么时候、在哪里、用什么拍的。地点可以修改或删除，也可以问你的代理照片里有什么。
    location: 位置。一天里在有名字的地点之间的到访，地图经由你自己的服务器绘制，下面是每一次到访和待了多久。
    circleChat: 家庭圈子的聊天。成员之间互相留言，有人叫的时候代理就来回答。
    circles: 一个圈子和里面的人，每个人和你是什么关系，还可以邀请别人或替别人开一个账户。
    contacts: "一位联系人自己的页面：有他参与的邮件、照片和录音，以及助手对他的了解。"
    passwordsShare: "把一个登录分享给圈子。它为每个人分别加密，安全码让你确认拿到的是对方正确的密钥。"
    passwordsAgent: "一个允许助手使用的登录。它只在这个登录自己的网站上登录，密码直接填入页面，从不交给模型，每次使用都有记录。"
    passwords: "密码。登录信息、卡片和笔记都在你自己的设备上加密，并标出与圈子共享的项目和助手可以使用的项目。"
    personCard: "一个人的名片，可从聊天、圈子、照片或地图打开：他在哪里（如果他分享了），以及你们彼此分享的内容。"
    search: "一次搜索所有内容：邮件、联系人、助手知道的事和你的文档，每一处都按各自的访问规则。"
    shoppingStore: "逛一家店：每张清单在 Harbor Market 要买的东西，按货架排好，Sam 正在店里一样样勾掉。"
    shopping: "按货架排好的共享日用品清单，写着每样东西的用途、数量和上次的价格。"
    journalMonth: "十月的日历，每天配上第一张照片、最高气温和心情，旁边是这个月自己的故事。"
    journal: "时间线：每天的标题、心情、天气和照片，最新的在前，旁边是这一周到目前为止。"
    journalDay: "日记里的一个星期六：助手写下的故事，提到的每样东西都是链接；那封要紧的邮件和原因；以及当天按顺序去过的地方。"
    financeSpending: 财务。十二个月里的收入和支出，以及剩下了多少；在你自己账户之间挪动的钱不算在内。
    financeCategories: 一个月按支出类别分开，放在预算下面。每一项预算都说明花到了哪里，以及这个月是否正常。
    financeReceipt: 一笔扣款和它的收据：从照片里逐行读出，和印出的合计核对过，并自己对应到了这笔扣款上。
    financeNetWorth: 净资产。你拥有和欠下的一切，来自接入的账户、你自己填的价值，以及你允许的地方由代理做的估价。
    agent: 你自己代理的页面：叫它什么、它该怎么写、它能够到哪些邮箱，以及它今天花了多少。
    knowledge: 代理所知的其中一个页面。路径就是它的地址，每条事实都有编号以便被引用，而历史会说明每一行是谁写的、之前是什么。
    graph: 同样的知识，画成一张图。页面按种类着色，连线说明关系，双击一个页面就会展开它连到的东西。
    subscriptions: 这个邮箱收到的每一个邮件列表，以及各自寄来的东西，还有两条出路：退订，或者静音让它自己归档。
    programs: 每台设备一份应用专用密码，用它让邮件程序通过 IMAP 登录，并通过提交端口发信。
    access: 人员、群组和角色。一个群组可以绑定到一个域名，它的权限就只到那里为止。
    aliases: 一个域名的别名。每个模式或者投递进一个邮箱，或者转发到一个地址、一个 webhook、另一台邮件服务器。
    dns: 一个域名的 DNS 记录。仪表盘逐条检查，并显示哪些缺失或不一致。
    agents: 运维者这一侧：这台服务器可以调用哪些模型服务、哪个模型做哪种活、人们到底可以打开什么，以及限额。
    mail: 邮件列表，筛选到一个域名。服务器处理过的每一封邮件，以及它对每一封作出的判断。
    message: 一封邮件。身份验证的检查及其证据、每一次投递尝试，以及去掉脚本的邮件本身。
    templates: 一个域名的邮件模板，各自带有变量和翻译。
    template: 编辑模板。主题和正文可以使用变量，版式包在结果外面。
    layout: 编辑版式，也就是一个域名发出的每一封邮件外面的框架。
    reports: 收到的关于你的域名的 DMARC 汇总报告，它们显示谁在以你的域名发信。
    report: 一份报告。哪些地址以这个域名发了邮件、发了多少，以及是否通过验证。
