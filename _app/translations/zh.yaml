  startHeading: 开始使用
  startLead: 用 docker compose 执行四条命令，然后打开仪表盘。
  startAfter: >-
    第一个访问仪表盘的人创建账户。在那里添加你的域名，它会列出要发布的 DNS 记录。
  startWalkthrough: 快速开始
  needHeading: 你需要什么
  needs:
    domain: 一个你能编辑 DNS 的域名。
    host: 一台地址稳定、开放 25、80、443、587 和 993 端口的主机。
    docker: 带 compose 的 Docker。PostgreSQL 随 compose 文件一起。
  needsAfter: 别的什么都不需要。不需要云账号，不需要 DNS API，证书自动获取。
  questionsHeading: 常见问题
  questions:
    port25:
      question: 我需要开放 25 端口吗？
      answer: >-
        接收邮件需要：其他邮件服务器通过 25 端口投递，没有别的入口。大多数家庭宽带会封锁它，
        大多数小型服务器不会。见[25 端口的问题](/doc/getting-started#25-端口的问题)。
    mailprogram:
      question: 我能用自己的邮件程序读吗？
      answer: >-
        可以。服务器在 993 端口提供 IMAP，在 143 端口提供 STARTTLS。在邮箱设置里为这台设备
        创建一份应用专用密码，Apple Mail、Thunderbird 或你的手机就能用你的地址和这份密码登录。
        同一份密码也能在 587 端口发信。
    forwarding:
      question: 我一定要用邮箱吗？
      answer: >-
        不一定。一个别名可以投递进邮箱、转发到你已经在读的地址、发到一个 webhook，
        或者交给另一台邮件服务器，同一个域名四种都能同时用。
    outbound:
      question: 我的主机封锁了外发 25 端口，还能发信吗？
      answer: >-
        可以。把中继设置指向某个服务商的提交端口：Amazon SES、Postmark、Resend 或一个 Gmail 账号都可以，
        邮件保留 TeaNode 加上的签名。见[中继](/doc/configuration#smtprelay)。
    team:
      question: 我的团队能用公司的身份提供商登录吗？
      answer: >-
        可以，通过 OpenID Connect。一个群组可以跟随你目录里的一个群组，角色决定它的成员能看什么、做什么；
        绑定到一个域名的群组，权限就只到那里为止。
    stored:
      question: 我的邮件存放在哪里？
      answer: >-
        在你的主机上，在你的 PostgreSQL 数据库里，原始邮件放在磁盘上或你选择的对象存储里。
        一封邮件只存一份，无论有多少个文件夹放着它，只要还有一个放着就一直保留。
