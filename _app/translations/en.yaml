  agent:
    heading: An assistant of your own
    lead: >-
      Point the server at a language model (OpenAI, Anthropic, Gemini, an Ollama
      or vLLM on the same machine, or a ChatGPT plan you already pay for) and
      each person in the household or the team gets an agent of their own. It
      sorts what arrives, writes drafts in your own voice, and answers
      questions about your life with exactly your permissions and nobody
      else's.
    privacy: >-
      Off until you turn it on, and blind to every mailbox until you grant it
      one. Nothing reaches a model while mail is being delivered; the work is
      queued afterwards. Point it at an Ollama or a vLLM of your own and nothing
      leaves the machine at all. Operators cap what it may spend, in tokens or in money.
    points:
      sorts:
        title: Sorts what arrives
        body: A category, a priority, whether somebody is waiting on an answer, and a line of summary, as chips on the row, with a Priority view beside Starred. A brief each morning says what the day holds, and anything that cannot wait reaches you when it arrives.
      drafts:
        title: Drafts in your voice
        body: A summary folded above a long conversation, and a reply written for you to read, change and send. Sending stays with you.
      answers:
        title: Answers, if you let it
        body: "Under a policy you write: who, which kinds, when, how many a day. Every reply waits in Drafts with a banner to cancel it or take it over."
      asks:
        title: Answers your questions
        body: A drawer on every page, and teanode agent ask in a terminal. It searches, files and drafts as you, and stops for your word before anything it cannot undo.
    reachLead: What it reaches, once you grant it
    reach:
      mail: Your mail
      contacts: Your contacts
      computer: Your computer
      browser: Your browser
      web: The web
