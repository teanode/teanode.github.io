    drawerHerdr: A Claude Code session on your computer stopped to ask something. The question comes to you, with its options as buttons, wherever you are talking to your agent.
    herdr: The coding sessions in herdr on your computers, with which one is working, which is idle, and which is waiting on you.
    contacts: The address book. The people you keep, synchronized to your phone over CardDAV (photographs, birthdays and all) rather than a list of everyone who has ever written.
    financeSpending: Finance. Income and spending across twelve months, with what was left over; money moved between your own accounts is left out.
    financeCategories: A month by spending category, under its budgets. Each budget says how far it has gone and whether the month is on track.
    financeReceipt: A charge with its receipt, read from a photo line by line, checked against its printed total and matched to the charge on its own.
    financeNetWorth: Net worth. Everything you own and owe, from linked accounts, values you enter, and estimates the agent makes where you allowed it.
    agent: >-
      Your agent's own page: what to call it, how it should write, which
      mailboxes it may reach, and what it has spent today.
    knowledge: One page of what your agent knows. Its path is its address, each fact is numbered so it can be cited, and the history says who wrote every line and what was there before.
    graph: The same knowledge as a graph. Pages by kind, links that say how, and a double click opens what a page is joined to.
    subscriptions: "Every mailing list this mailbox receives, with what each has sent, and the two ways out: leave it, or mute it and let it file itself."
    programs: An app password for each device, which signs a mail program in over IMAP and sends through the submission port.
    access: People, groups and roles. A group can be tied to one domain, so its permissions reach only that far.
    mail: The mail list, filtered to one domain. Every message the server has handled and what it decided about each one.
    message: One message. The authentication checks with their evidence, every delivery attempt, and the message itself with scripts removed.
    aliases: A domain's aliases. Each pattern delivers into a mailbox, or forwards to an address, a webhook, or another mail server.
    dns: A domain's DNS records. The dashboard checks each one and shows what is missing or different.
    agents: >-
      The operator's side: which model services this server may call, which model
      does which work, what people may turn on at all, and the limits.
    templates: A domain's message templates, each with its variables and translations.
    template: Editing a template. The subject and body take variables, and a layout wraps the result.
    layout: Editing a layout, the frame around every message a domain sends.
    reports: DMARC aggregate reports received about your domains, which show who is sending as them.
    report: One report. Which addresses sent mail as the domain, how much, and whether it passed.
  mailHeading: And your own mail server, if you want one
