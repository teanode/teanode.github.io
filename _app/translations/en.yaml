  voice:
    heading: Call it
    lead: Press the telephone in the chat drawer, or call it from the iPhone app, and talk. Each thing you finish saying goes to your agent as a turn, and the answer is read back to you as it is written.
    body: >-
      It works on any page, on a laptop or a phone, and a spoken turn reaches
      every tool a typed one does. What was said stays in the conversation, so
      you can hang up and carry on typing.
    more: How voice works
    points:
      call:
        title: Answers straight away
        body: It says it is looking before it looks, and makes the small sounds a listener makes while you talk at length.
      ear:
        title: Written for the ear
        body: The answer first, a few short sentences, numbers said the way people say them, and a check before acting on a name it may have misheard.
      cutIn:
        title: Cut in when you like
        body: Start talking and the answer drops to a murmur, then stops. The agent is told how much of it you heard.
      key:
        title: The key stays on the server
        body: The drawer talks to your server and your server talks to the provider. Calls count against the same daily limits.
  coding:
    heading: Your coding sessions, from anywhere
    lead: Keep your Claude Code and Codex sessions in herdr, and your agent sees every one of them, on every computer you attached.
    body: >-
      It reads what each session did, types an instruction into one where you
      can see it, and brings you the questions they stop to ask. Ask it from
      ChatGPT or Grok on your phone, by voice in the car, what your sessions
      are up to, and answer the one that is waiting.
    more: How coding sessions work
    points:
      sees:
        title: Every session, every computer
        body: Working, idle or asking, with the directory and the title, on the Connections tab and from the command line.
      types:
        title: Types where you can see
        body: One process, one history and one screen, which you and the agent share. You can take over at any moment.
      asks:
        title: Their questions come to you
        body: In the drawer with the options as buttons, and in your chat app. Whoever answers first wins, and a stale answer is refused.
      remembers:
        title: They know what your agent knows
        body: With teanode hook installed, a session starts with the project's page and where the last one there stopped, and each prompt brings what it recalls from that project alone.
      anywhere:
        title: From anything that speaks MCP
        body: ChatGPT, Grok, an editor or a voice call in the drawer. Tell a session what to do next, or ask to hear when it is done.
  mcp:
    heading: And from your editor, or your phone
    lead: TeaNode answers the Model Context Protocol, so a coding harness, an editor, or a chat assistant such as ChatGPT or Grok can use your agent's tools and ask your agent questions.
    body: >-
      Point a program at the address and approve it in your browser; there is
      no token to copy. It is offered what your permissions allow, less
      whatever the operator switched off, so somebody who may not read mail is
      not offered the search, and the token it gets is good for the agent tools
      alone. Settings, then Apps, disconnects it. Ask it a question in words and
      the answer has its memory of you behind it, rather than six calls of your
      own.
  finance:
    heading: Your money
    lead: Link your banks, cards and brokerages through Plaid or SimpleFIN, and the Finance page shows where the money went, where the month is heading, and what it all adds up to.
    body: >-
      The rows are kept in your own database, beside your mail, and the
      credentials are sealed with the server's secret. Your agent reads the
      same rows, so you can ask how much went on eating out in September, or
      whether the emergency fund is on track.
    more: How finance works
    points:
      linked:
        title: Linked, or imported
        body: SimpleFIN with a setup token of your own, or Plaid with the operator's keys. A card no provider reaches comes in from a statement file or screenshots.
      categories:
        title: Your own categories
        body: Filed by you, by your rules, by the bank's category, and only then by a model. Choose a page of transactions and file them, and their merchants, at once.
      receipts:
        title: Receipts, line by line
        body: Photographed into the chat or arriving as mail, checked against the printed total and matched to the charge, so you can search what you bought.
      budgets:
        title: Budgets that look ahead
        body: Each says where the month is heading, counting the bills still to come. Savings targets say what they need each month.
      netWorth:
        title: Net worth
        body: Accounts, holdings, a house and a car, in any currency, with the agent estimating what you let it.
  taxes:
    heading: Your taxes
    lead: >-
      Hand it your paystubs, W-2s, 1099s and 1098s, as a PDF, a photo, a file
      shared from your phone or a forwarded mail, and it puts the tax year
      together: what you earned, what was withheld, and what you are likely to
      owe or get back.
    body: >-
      Each form is read into its boxes and checked against itself, each
      paystub against the one before it, and each W-2 against the year's last
      paystub. Only the last four digits of a taxpayer number are ever kept,
      and the file is kept without its text. It is an estimate to start a
      return from, not the return.
    more: How taxes work
    anchor: taxes
    points:
      documents:
        title: Every form, read for you
        body: Paystubs line by line, W-2s box by box, 1099-INT, DIV and B, and 1098s, mailed to an address of your own or shared from the phone.
      checks:
        title: Checked as they come
        body: Social Security and Medicare worked out from the wages, a missing paystub or a W-2 that disagrees pointed out, and tax withheld past the year's maximum noticed.
      projection:
        title: The year, carried to December
        body: Pay projected at your own cadence, retirement contributions stopping at the year's limit, and interest and dividends previewed from your accounts before the 1099s arrive.
      estimate:
        title: An estimate, with the deductions
        body: The federal brackets, itemizing when it beats the standard deduction, gains at their own rates, and the child and dependent care credits, set beside what was withheld.
  meetings:
    heading: Your meetings
    lead: >-
      Record a meeting on your iPhone and your agent writes it up: a
      transcript as it happens, the speakers by name, and a summary of what
      was decided.
    body: >-
      The original stays on your server. Correct a line it misheard or name a
      speaker, and it summarizes again with what you fixed; what the meeting
      taught goes on the pages of the people and projects involved, with a
      link back to the moment it was said.
    points:
      live:
        title: Transcribed as you go
        body: Pieces are transcribed side by side while the recording runs, so a long meeting is not a long wait.
      speakers:
        title: Who said what
        body: Name a speaker once and every passage follows. Only the speakers nobody has named are left to ask about, and the filler is left out.
      corrections:
        title: Your corrections stay
        body: Every version of the transcript is kept, and a later pass never undoes a line you fixed.
      memory:
        title: Into memory
        body: Decisions, dates and promises land on the pages they belong to, cited to the recording.
  memory:
    heading: A memory that learns you
    lead: >-
      What your agent knows is a graph of pages, not a list of notes. A page is
      a person, a project, a place, a thing or a stretch of time; it lives at a
      path like projects/greenfinch, and every fact on it is numbered, carries the words
      it came from, and can be cited in an answer. Pages are joined by links that
      say how: who works on what, who knows whom, what a decision belongs to.
    body: >-
      Nothing is ever deleted. A fact nothing has wanted in months stops arriving
      uninvited and is still there when you search for it, and every change to
      every page says who made it (you, the agent, a dream, a source
      being read) and what was there before, so you can put it back. It is all
      on the Knowledge page, and all on the command line.
    sourcesLead: Where it reads from, once you point it at something
    sources:
      checkout: A checkout on your computer
      archive: A chat archive
      notes: Your notes
      wiki: A wiki, through a skill
      web: A site you name
      sent: Your own sent mail
    points:
      writes:
        title: It writes without being asked
        body: A job runs once a conversation goes quiet and files what the conversation taught, so what you said on Tuesday is there on Wednesday. The first version asked the model to write during the turn; over 456 turns it wrote two, both tests. Given a task and a memory tool, a model does the task.
      reads:
        title: It reads what you already have
        body: Point it at a checkout, a chat export or a folder of dated notes and it keeps a searchable, citable copy. The walking, the sniffing and the refusing happen on the machine the files are on, so a key or a password never crosses the wire. What it read is yours to search too, without asking it and without paying for a turn.
      dreams:
        title: It tidies while you sleep
        body: In hours you set, after you have been quiet a while, it reads what arrived, writes up the month, rewrites the pages that changed, divides one that has outgrown itself, and walks the graph for connections nobody wrote down. Then it asks itself the questions you are likely to ask tomorrow and writes down the ones it could not answer.
    page:
      label: A page from the agent's memory, and the link a dream drew across it
      connections: Connections
      opening: Greenfinch, the claims system Osborne & Sons file through. Ours to run, and the thing most of this quarter went into.
      facts:
        leads: Grace Hopper has led the controls work since March.
        readme: Its readme says it is a claims portal for wholesale customers.
        terms: Payment terms moved from sixty days to ninety in September.
        member: Grace Hopper works at Osborne & Sons.
      from:
        conversation: You said so · 4 March
        file: README.md · on your laptop
        thread: The contract thread · 12 September
        night: Drawn in the last dream, from two pages nothing had joined
      lastNight: Read 42 messages and 6 files · filed 9 facts on 5 pages · merged 2
      dreaming: Walking the graph for connections nobody wrote down…
  featuresHeading: What it does
  features:
    mailbox:
      title: A mailbox for every account
      body: Folders that nest, search across all of it, rules, drafts, a signature, an out-of-office reply and keyboard shortcuts.
    imap:
      title: IMAP for any mail program
      body: Read the same mailbox anywhere. One app password per device, which sends on the submission port too.
    authenticates:
      title: Authenticates and scores
      body: SPF, DKIM, DMARC and ARC on the way in, signed on the way out, and spam scored by a filter built in.
    forwards:
      title: Forwards flexibly
      body: Patterns route each address to a mailbox, an inbox elsewhere, a webhook or another server.
    calendar:
      title: A calendar, reminders, notes and contacts
      body: Your phone keeps them in step over CalDAV, CardDAV and IMAP, signing in with the app password it already has, so its own Calendar, Reminders, Notes and Contacts apps just work. Invitations arrive and go out as mail.
    subscriptions:
      title: Every mailing list, and the way out
      body: Newsletters on a page of their own. Leave one the way its sender says to, or mute it and let it file itself.
    marks:
      title: The mark beside the sender
      body: Shows the logo a domain publishes, and only for mail that passed DMARC. Helps you publish your own.
    access:
      title: People, groups and roles
      body: Permissions decide what each person sees, single sign-on follows your directory, and every change is logged.
    shows:
      title: Shows you every message
      body: The verdicts, the delivery attempts, and the DMARC reports about your domains.
  extrasLead: Also, when you want them
  extras:
    templates: Templates and layouts
    cli: Command line client
    clamav: ClamAV
    spamd: External SpamAssassin
    geoip: GeoIP
    s3: S3 mirror
    socks5: SOCKS5 proxy
    dns01: DNS-01 certificates
  startHeading: Getting started
  startLead: One compose file either way. Start with just the assistant, and add your own mail when you want it.
  start:
    assistant:
      title: Just the assistant
      note: No domain and no mail ports. It listens on 127.0.0.1:8080; put an HTTPS proxy in front of it to reach it from your phone.
      after: Open the dashboard, claim the account, choose a model and turn the assistant on.
      guide: Running the assistant alone
    mail:
      title: With your own mail
      note: Mail at your domains, with the assistant and everything above.
      after: >-
        The first visitor to the dashboard creates the account. Add your domain
        there, and it lists the DNS records to publish.
  startWalkthrough: The quick start
  needHeading: What you need
  needs:
    host: A computer that stays on, with Docker and compose. PostgreSQL comes with the compose file.
    model: A model to think with. An API key, a ChatGPT plan you already pay for, or an Ollama or vLLM of your own.
    https: For the iPhone app and for away from home, an HTTPS address in front of it, from any reverse proxy.
    mail: For your own mail, a domain whose DNS you can edit and ports 25, 80, 443, 587 and 993 open.
  needsAfter: >-
    No account with us, because there is nothing of ours to sign up for.
    Notifications to the app pass through a relay that sees the calling
    server's address and a payload it cannot read.
  questionsHeading: Questions
  questions:
    mailserver:
      question: Do I have to run a mail server?
      answer: >-
        No. The assistant runs on its own, with no domain, no MX records and no
        mail ports, and the calendar, reminders and contacts are separate
        choices. Add hosted mail later from Server, then Setup, and what you
        already have stays.
    app:
      question: Is the iPhone app on the App Store?
      answer: >-
        Not yet. It is in TestFlight and on its way to the App Store, as one
        app that connects to any TeaNode server. Until then, the `ios`
        directory of the repository builds it with your own developer account.
    model:
      question: Which model does it use, and who sees my data?
      answer: >-
        The one your server is pointed at: OpenAI, Anthropic, Gemini, a ChatGPT
        plan, or an Ollama or vLLM on your own hardware. What your agent reads
        goes to that model and nowhere else, so with a local one nothing leaves
        the machine. The operator caps what each person may spend.
    port25:
      question: Do I need port 25 open?
      answer: >-
        For receiving, yes: other mail servers deliver on port 25 and there is
        no other way in. Most home connections block it and most small
        servers do not. See [the port 25 problem](/doc/getting-started#the-port-25-problem).
    mailprogram:
      question: Can I read it in my own mail program?
      answer: >-
        Yes. The server speaks IMAP on port 993, and STARTTLS on 143. Make an
        app password for the device under Mailbox settings, and Apple Mail,
        Thunderbird or your phone signs in with your address and that password.
        The same password sends on port 587.
    forwarding:
      question: Do I have to use the mailbox?
      answer: >-
        No. An alias can deliver into a mailbox, forward to an address you
        already read, post to a webhook, or hand the message to another mail
        server, and one domain can do all four at once.
    outbound:
      question: My host blocks outbound port 25. Can I still send?
      answer: >-
        Yes. Point the relay setting at a provider's submission port: Amazon
        SES, Postmark, Resend or a Gmail account all work, and the mail keeps
        the signature TeaNode added. See [relaying](/doc/configuration#smtprelay).
    team:
      question: Can my team sign in with our identity provider?
      answer: >-
        Yes, through OpenID Connect. A group can follow a group in your
        directory, and roles decide what its members may see and do; a group
        tied to one domain reaches only that far.
    stored:
      question: Where does my mail live?
      answer: >-
        On your host, in your PostgreSQL database, with the raw message on
        disk or in an object store you choose. A message is stored once
        however many folders hold it, and kept for as long as one does.
