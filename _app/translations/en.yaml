welcome:
  lead: >-
    Give every side project and every early startup a real address at its own
    domain, without running a mailbox for each one. TeaNode is a small
    self-hosted mail server that receives mail for all of your domains,
    checks that it is genuine, and forwards it to the inbox you already read,
    or to a webhook. Reply and send from those addresses too, signed with the
    domain's key so it arrives rather than landing in spam.
  notMailbox: >-
    It is deliberately not a mailbox server. There is no IMAP and no inbox.
    Keep reading mail wherever you read it now; TeaNode owns the domain, the
    authentication and the routing.
  getStarted: Get started
  readDocs: Read the documentation
  viewSource: View the source
  screenshotCaption: >-
    The mail list, filtered to one domain. Every message the server has
    handled, what it decided about each one, and whether the recipient's mail
    program fetched the pictures in it.
  whyHeading: Why
  why: >-
    Running mail for a domain usually means either handing it to a provider,
    or assembling Postfix, Dovecot, OpenDKIM, OpenDMARC, SpamAssassin and a
    policy daemon and keeping them in agreement. This is one executable and a
    PostgreSQL database, with the authentication that decides whether your
    mail is trusted built in rather than bolted on.
  featuresHeading: What it does
  features:
    authenticates:
      title: Authenticates everything
      body: >-
        SPF, DKIM, DMARC and ARC on the way in, with the results shown per
        message. Your outbound mail is DKIM signed, and forwarded mail keeps an
        ARC chain so it still passes at the far end.
    forwards:
      title: Forwards flexibly
      body: >-
        Aliases match the address with a regular expression and send the
        message to an address, an HTTP endpoint, or another mail server. An
        empty pattern is a catch-all, which receives whatever nothing else
        matched.
    relays:
      title: Relays your outbound mail
      body: >-
        Per-device SMTP credentials on the submission port, each optionally
        restricted to one sender address.
    shows:
      title: Shows you the mail
      body: >-
        The dashboard renders a message as a message: the authentication
        verdicts, the delivery attempts and why any of them failed, and the
        body itself with scripts stripped and remote images blocked until you
        ask for them.
    sends:
      title: Sends mail you write
      body: >-
        Templates with variables and translations, a layout around them,
        pictures served from your own domain, and a record of whether the
        recipient's mail program fetched them.
    reports:
      title: Reports on your domains
      body: >-
        Incoming DMARC aggregate reports are parsed and kept, which is how you
        find out somebody is forging your domain.
    extras:
      title: Optional extras, all off by default
      body: >-
        ClamAV, SpamAssassin, GeoIP, an S3 mirror of stored messages, an
        outbound SOCKS5 proxy for hosts whose address has a poor reputation,
        and DNS-01 certificates if you need a wildcard.
    dashboard:
      title: One binary, dashboard included
      body: >-
        The dashboard is compiled into the server; there is nothing else to
        deploy. A command line client reaches the same API from anywhere.
  startHeading: Getting started
  startLead: Download the two programs, describe the server, run it.
  startAfter: >-
    The first command prints the DNS record for your signing key. Publish it,
    along with an MX record pointing at your server, and mail starts arriving.
    The dashboard lists exactly which records are still missing.
  startWalkthrough: The full walk-through
  needHeading: What you need
  needs:
    domain: A domain, and the ability to edit its DNS.
    host: A host with a stable address, reachable on ports 25, 80, 443 and 587.
    database: PostgreSQL, for the configuration and the mail it has handled.
  needsAfter: >-
    Nothing else. No cloud account, no Redis. Certificates are obtained
    automatically over HTTP-01, so there is no DNS API to configure.
