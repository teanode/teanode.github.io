  mailHeading: And your own mail server, if you want one
  headlineMail: Send and receive mail at your own domains.
  mailLead: >-
    TeaNode began as a mail server, and it still is one once you give it a
    domain. It receives at your domains, checks every message, files it in a
    mailbox you read here or in any mail program, and forwards what belongs
    somewhere else. Your assistant then reads that mail where it lands.
