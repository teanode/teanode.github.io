welcome:
  headline: Send and receive emails at your own domains.
  lead: >-
    Read the mail here or in any mail program, forward what belongs somewhere
    else, and give each person a private assistant that reaches their mail,
    their contacts, their calendar, their computer and their browser. One binary, one
    PostgreSQL, your hardware. Point the assistant at an Ollama or a vLLM of
    your own and nothing leaves the machine.
