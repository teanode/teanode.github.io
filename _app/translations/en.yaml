welcome:
  headline: A personal assistant that lives on your own server.
  lead: >-
    It reads your mail, keeps your calendar, files your receipts and tax
    forms, writes up your meetings and keeps an eye on your coding sessions,
    and it remembers what it learns about you. Talk to it from the iPhone app,
    a browser or a call. One program and one PostgreSQL on your hardware;
    point it at an Ollama or a vLLM of your own and nothing leaves the machine.
  getStarted: Get started
  iphoneButton: The iPhone app
  lifeHeading: What it looks after
  life:
    mail:
      title: Your mail
      body: Sorts what arrives, says what is waiting on you, and drafts the answer in your voice. Sending stays with you.
    days:
      title: Your days
      body: A calendar, reminders, notes and an address book your phone keeps in step, and invitations answered from the conversation.
    money:
      title: Your money
      body: Banks, cards and brokerages linked or imported, spending filed your way, budgets that look ahead, and receipts matched to their charges.
    taxes:
      title: Your taxes
      body: Paystubs, W-2s, 1099s and 1098s read from a PDF or a photo, and the year added up into what you are likely to owe or get back.
    meetings:
      title: Your meetings
      body: Record on your iPhone, and get a transcript as it happens, the speakers by name, and a summary filed where it belongs.
    memory:
      title: What you told it
      body: A memory of the people, projects and places in your life, which it writes as you talk, cites when it answers, and tidies in its dreams.
    coding:
      title: Your coding sessions
      body: Claude Code and Codex on every computer. Their questions come to you, and they start knowing what your agent knows.
    computer:
      title: Your computer and browser
      body: Files, a terminal and a browser on the machines you attach, with your word asked before anything it cannot undo.
  phone:
    heading: TeaNode for iPhone
    lead: Your assistant, in your pocket.
    body: >-
      Chat with it, call it, answer it from a notification, and hand it what
      you are looking at from any app. One app for every TeaNode server: scan the code your dashboard shows and
      it connects as you, with nothing to type. It carries what the dashboard
      does, from mail and the calendar to finance and knowledge, drawn in the
      system's own controls and at your text size.
    availability: In TestFlight now, and on its way to the App Store
    privacy: The app's privacy policy
    galleryLabel: Screens of the iPhone app, with invented data
    points:
      chat:
        title: The conversation, everywhere
        body: Every card the dashboard's drawer shows, including a coding session's question with its answers as buttons. Ask about a mail, a charge or a page from where it is.
      notify:
        title: Answer from the notification
        body: What needs you arrives as a notification you can reply to. A running turn sits on the lock screen as a Live Activity, and widgets show what is waiting and what is next.
      call:
        title: Call it, or ask Siri
        body: A real phone call you can cut into, on the speaker or in your headphones. Ask TeaNode and Call TeaNode work from Siri, Shortcuts and Control Center.
      share:
        title: Share anything to it
        body: A picture, a file, a link or some words go to your agent with a note. Paystubs and W-2s go straight to Taxes, and a bank's export to your statements.
      record:
        title: Record a meeting
        body: The phone records, the server transcribes as it goes, and an upload the network cut off carries on where it stopped.
      setup:
        title: Mail, calendars and contacts too
        body: One profile adds your mailbox, calendars and contacts to the iPhone's own apps, and your address book can come in from the phone.
    captions:
      conversation: "The conversation: a mail drafted, a coding session's question, and a reply waiting for your word."
      mail: The inbox, with what is important and what needs a reply marked.
