  memory:
    heading: A memory that learns you
    lead: >-
      What your agent knows is a graph of pages, not a list of notes. A page is
      a person, a project, a place, a thing or a stretch of time; it lives at a
      path like projects/greenfinch, and every fact on it is numbered, carries the words
      it came from, and can be cited in an answer. Pages are joined by links that
      say how — who works on what, who knows whom, what a decision belongs to.
    body: >-
      Nothing is ever deleted. A fact nothing has wanted in months stops arriving
      uninvited and is still there when you search for it, and every change to
      every page says who made it — you, the agent, last night's run, a source
      being read — and what was there before, so you can put it back. It is all
      on the Knowledge page, and all on the command line.
    sourcesLead: Where it reads from, once you point it at something
    sources:
      checkout: A checkout on your computer
      archive: A chat archive
      notes: Your notes
      wiki: A wiki, through a skill
      web: A site you name
      sent: Your own sent mail
    points:
      writes:
        title: It writes without being asked
        body: A job runs once a conversation goes quiet and files what the conversation taught, so what you said on Tuesday is there on Wednesday. The first version asked the model to write during the turn; over 456 turns it wrote two, both tests. Given a task and a memory tool, a model does the task.
      reads:
        title: It reads what you already have
        body: Point it at a checkout, a chat export or a folder of dated notes and it keeps a searchable, citable copy. The walking, the sniffing and the refusing happen on the machine the files are on, so a key or a password never crosses the wire. What it read is yours to search too, without asking it and without paying for a turn.
      dreams:
        title: It tidies while you sleep
        body: In hours you set, after you have been quiet a while, it reads what arrived, writes up the month, rewrites the pages that changed, divides one that has outgrown itself, and walks the graph for connections nobody wrote down. Then it asks itself the questions you are likely to ask tomorrow and writes down the ones it could not answer.
