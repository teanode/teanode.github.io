  featuresHeading: What it does
  features:
    authenticates:
      title: Authenticates everything
      body: >-
        SPF, DKIM, DMARC and ARC on the way in, shown per message. Outbound
        mail is DKIM signed, and forwarded mail carries an ARC chain so it
        still passes at the far end.
    forwards:
      title: Forwards flexibly
      body: >-
        Aliases match addresses with a pattern and forward to an address, a
        webhook, or another mail server. A catch-all takes whatever nothing
        else matched.
    relays:
      title: Sends from your own addresses
      body: >-
        Per-device SMTP credentials, so your phone, laptop and applications
        send as any of your domains. A credential can be limited to one
        sender address.
    shows:
      title: Shows you the mail
      body: >-
        Every message with its verdicts, its delivery attempts, and the body
        with scripts removed and remote images blocked until you ask.
    sends:
      title: Sends mail you write
      body: >-
        Templates with variables and translations, a layout around them, and
        pictures served from your own domain.
    reports:
      title: Reports on your domains
      body: >-
        Incoming DMARC aggregate reports are parsed and kept, which is how
        you find out that somebody is forging your domain.
  featuresAlso: >-
    The dashboard is built into the server and a command line client reaches
    the same API from anywhere. ClamAV, SpamAssassin, GeoIP, an S3 mirror of
    stored mail, an outbound SOCKS5 proxy and DNS-01 certificates are there
    when you want them, and off until you do.
  startHeading: Getting started
  startLead: Four commands with docker compose, then open the dashboard.
  startAfter: >-
    The first visitor to the dashboard creates the account. Add your domain
    there, and it lists the DNS records to publish.
  startWalkthrough: The quick start
  needHeading: What you need
  needs:
    domain: A domain, and the ability to edit its DNS.
    host: A host with a stable address, reachable on ports 25, 80, 443 and 587.
    docker: Docker with compose. The compose file starts PostgreSQL for you.
  needsAfter: >-
    Nothing else. No cloud account. Certificates are obtained
    automatically over HTTP-01, so there is no DNS API to configure.
  questionsHeading: Questions
  questions:
    port25:
      question: Do I need port 25 open?
      answer: >-
        For receiving, yes: other mail servers deliver on port 25 and there is
        no other way in. Most home connections block it and most small
        servers do not. See [the port 25 problem](/doc/getting-started#the-port-25-problem).
    reply:
      question: Can I reply from Gmail?
      answer: >-
        Yes. Create an SMTP credential in the dashboard and add the address
        to Gmail under "Send mail as", with TeaNode as the outgoing server.
        The reply leaves signed with your domain's key.
    outbound:
      question: My host blocks outbound port 25. Can I still send?
      answer: >-
        Yes. Point the relay setting at a provider's submission port: Amazon
        SES, Postmark, Resend or a Gmail account all work, and the mail keeps
        the signature TeaNode added. See [relaying](/doc/configuration#smtprelay).
    stored:
      question: Does it keep my mail?
      answer: >-
        Messages stay on disk for as long as you say, so the dashboard can
        show them and a failed delivery can be retried, then they are
        removed. Set the retention to zero to keep everything.
