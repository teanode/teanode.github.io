welcome:
  headline: A personal agent for your whole life, on a server you own.
  lead: "Your mail, calendar and contacts, your photos and where you have been, your health, your coding sessions, your meetings, your money and your passwords, joined up in one agent that sees how they connect. It all runs on your own hardware, one program and one PostgreSQL, so your life is stored with you and nowhere else. You choose the model, you choose what it may reach, and you can take any of it back. Point it at an Ollama or a vLLM of your own and nothing leaves the machine at all."
  getStarted: Get started
  iphoneButton: The iPhone app
  coreHeading: Everything it looks after
  core:
    chat:
      name: Chat
      tile: Your agent, and the people you live with, in one conversation list.
      title: Talk to your agent, and to your people
      body: >-
        One conversation with your agent on every page of the dashboard, in the
        iPhone app and on a call, with your family's and friends' chats beside
        it. Bring your agent into any of them with an @.
      more: How the agent works
      points:
        call:
          title: Call it
          body: Press the telephone in the drawer or the app and talk. The answer is read back as it is written, and you can cut in whenever you like.
        links:
          title: "Links you can see before you open them"
          body: "A link somebody sends shows short and clean, with its tracking words taken off and a card of the page it leads to. On the iPhone it opens inside the app."
    search:
      name: "Search"
      tile: "One box that looks through mail, chats, photos, memory and the rest at once."
      title: "One search across all of it"
      body: "Type a word and your server looks in nine places at once: your conversations with your agent, mail, contacts, photos, memory, documents, recordings, places and finance. A few results from each, grouped, with a way into the full list. It asks no model and builds no new index."
      points:
        areas:
          title: "Nine places at once"
          body: "Each part is searched the way its own page searches it, side by side, and one that is slow never holds up the rest."
        access:
          title: "Only what you may open"
          body: "Each part is searched under the same check as its own page, so a search never shows what you could not see there."
        keys:
          title: "From anywhere"
          body: "The box at the top of the sidebar, Control-K or Command-K on any page, the Search tab on the iPhone, and teanode search on the command line."
        agent:
          title: "Your agent searches too"
          body: "Asked about something it cannot place, the agent searches the same way, within what you granted it."
    mail:
      name: Mail
      tile: Sorted, summarized and followed through, with replies drafted in your voice.
      title: Mail that sorts itself, and follows through
      body: >-
        Your agent reads what arrives, marks what matters and what is waiting on
        you, keeps track of the bills, parcels and deadlines in it, and writes
        the replies for you to send. It is a whole mail server for your own
        domain, read here, in the app or in any mail program.
      more: Run it as your mail server
    calendar:
      name: Calendar
      tile: Calendars and reminders, in step with your phone and shared as you choose.
      title: A calendar that keeps up with you
      body: >-
        Calendars and reminders on your server, in step with every device.
        Invitations that arrive as mail become events, your agent answers "am I
        free Thursday" and books the time, and a family calendar sits beside
        your own.
      points:
        sync:
          title: On every device
          body: CalDAV keeps the iPhone's own Calendar and Reminders, and any other calendar app, in step with the server.
        invites:
          title: Invitations, answered
          body: An invitation that arrives as mail becomes an event you can accept from the conversation, and your agent makes one when you ask.
    contacts:
      name: Contacts
      tile: One address book, in step with your phone, that knows who is who.
      title: An address book that knows who is who
      body: >-
        The people you keep, with photographs, birthdays and addresses, in step
        with your phone and known to your agent, so "ask my father" or "Sam's
        new number" reaches the right person.
      more: How circles work
      points:
        sync:
          title: In step with your phone
          body: CardDAV keeps the iPhone's Contacts in step, photographs and birthdays included, and your phone's address book can come in from the app.
        circles:
          title: The people you live with
          body: A circle joins the accounts of a family or friends, and a contact who has an account on the server is linked to it, so a chat or a share is a tap away.
        card:
          title: "A card for each person"
          body: "Open anyone from a chat, a circle, a photo or the map: who they are to you, what they share with you of where they are and their health, photos of them, your mail with them and the meetings they spoke in."
        agent:
          title: Your agent knows them
          body: It looks people up when it writes, schedules or files, and keeps a page in memory for each person who matters.
    photos:
      name: Photos
      tile: Your library, backed up from the phone and found by what is in it.
      title: Your photo library, on your own server
      body: >-
        Your iPhone backs its library up in the background, and the Photos page,
        the app and your agent all read the same library: by month, by album, by
        place and by the people in it. The faces are found on your server
        itself, never by a service elsewhere.
      more: How photos work
    location:
      name: Location
      tile: Where you have been, on a map of your day, shared only if you say so.
      title: Where you have been, kept by you
      body: >-
        The iPhone app keeps your visits to places, also while it is closed, and
        your server names them and draws your day on a map. Share where you are
        with the people you choose, and ask your agent when you last went
        somewhere.
      more: How location works
      points:
        visits:
          title: Every visit, on a map
          body: Arrivals and departures from the iPhone's own visit detection, with how long each lasted. A day offline arrives whole when the network is back.
        places:
          title: Places you name
          body: Home, work, school or the gym. A name you give is never replaced, and arriving at one can tell the people you share with.
        agent:
          title: It learns your routine
          body: Ask when you last went to the dentist, or whether Sam is home yet. Erase a day, a range or all of it whenever you like.
    health:
      name: Health
      tile: Your Apple Health data, charted on your server and shared by category.
      title: Your health, on your server
      body: >-
        The iPhone app copies your Apple Health data to your own server: steps,
        sleep, heart rate, workouts and the rest. The dashboard and the app
        chart it, and nobody else sees any of it unless you share it.
      more: The app's privacy policy
      points:
        copied:
          title: Copied from Apple Health
          body: Everything HealthKit lets an app read, except clinical records, sent as it is saved. The phone keeps no copy of its own.
        charts:
          title: By day, week and year
          body: Steps, sleep stages, heart rate, weight and workouts with their routes, on the dashboard, in the app and from the command line.
        sharing:
          title: Shared by category
          body: Share Activity or Sleep with your circle and they see day summaries, such as seven hours slept, never the readings or your routes.
        agent:
          title: Your agent reads it only if you let it
          body: Off until you turn it on, and only ever your own. Erase a range or all of it at any time.
    coding:
      name: Coding
      tile: Claude Code and Codex on every computer, with their questions sent to you.
      title: Your coding sessions, from anywhere
      body: >-
        Keep your Claude Code and Codex sessions in herdr, and your agent sees
        every one of them on every computer you attached. Their questions come to
        you wherever you are, and each session starts knowing what your agent
        knows.
      more: How coding sessions work
      points:
        agents:
          title: "Every agent in a session"
          body: "The agents a live session started show as a tree under it, each with its task, its model and whether it is still running."
    knowledge:
      name: Knowledge
      tile: A graph of the people, projects and places in your life, kept on your server.
      title: A memory that learns you
      body: >-
        What your agent knows is a graph of pages, people, projects, places and
        things, joined by links that say how. Every fact is numbered, carries the
        words it came from and can be cited in an answer, and every change says
        who made it, so you can put it back.
      more: How memory works
    recordings:
      name: Recordings
      tile: Meetings recorded on the phone, transcribed by speaker and summarized.
      title: Meetings, written up for you
      body: >-
        Record a meeting on your iPhone and your agent writes it up: a transcript
        as it happens, the speakers by name, a summary of what was decided, and
        what it taught filed in memory. The original stays on your server.
    finance:
      name: Finance
      tile: Accounts, spending, budgets, receipts, net worth and the tax year.
      title: Your money, and your taxes
      body: >-
        Link your banks, cards and brokerages through Plaid or SimpleFIN, or
        import a statement, and see where the money went, where the month is
        heading and what it all adds up to. The rows are kept in your own
        database, and your agent reads the same rows, so you can just ask.
      more: How finance works
      points:
        taxes:
          title: The tax year, put together
          body: Paystubs, W-2s, 1099s and 1098s read from a PDF or a photo, checked against each other, and the year added up into what you are likely to owe or get back.
    payments:
      name: Payments
      tile: Your agent pays for you, within limits you set, and only with your word.
      title: Payments, with your word on each one
      body: >-
        Your agent pays through a payment skill running on your own computer,
        such as Link, and never sees a card number. Lend it to somebody in your
        household with limits, and anything above them waits for you.
      more: How sharing works
      points:
        agent:
          title: It pays, you confirm
          body: The skill runs on your computer, signed in as you, and each payment still waits in the payment app for your word.
        share:
          title: Shared with your household
          body: Lend the paying tool to somebody in your circle. Their agent pays with it on your computer, and never reads your balances or transactions.
        limits:
          title: Limits you set
          body: The most one payment may be and the most a month. Anything above them, or with a price the server cannot read, waits for you.
        approve:
          title: Approve from anywhere
          body: A card in your drawer and a notification on your phone, with the amount and the note their agent wrote. Ask me every time is there for a child.
    passwords:
      name: "Passwords"
      tile: "Logins, passkeys and codes, encrypted on your devices, used by your agent only where you say."
      title: "Passwords your server cannot read"
      body: "Logins, passkeys, one-time codes, cards and notes are sealed on your phone or in your browser before they reach your server, so neither the server nor whoever runs it can read them. Fill them in Chrome and on the iPhone, share them with your circle, and let your agent sign in with the few you choose."
      more: "How Passwords works"
      points:
        sealed:
          title: "Encrypted on your devices"
          body: "A passphrase only you know opens them, and then Face ID on the iPhone. The server, a backup and the agent see sealed text, sites and user names included."
        fills:
          title: "Filled where you sign in"
          body: "The Chrome extension fills logins, saves new ones, and makes passwords and passkeys. On the iPhone, TeaNode fills Safari and every other app, one-time codes too."
        share:
          title: "Shared with your circle"
          body: "Give a login to one person or the whole circle. It is sealed for their devices alone, and only you change it."
        agent:
          title: "Your agent signs in, and never reads"
          body: "Turn on \"Let the agent use this\" for one login, and the agent can sign in with it on that login's own sites, in a conversation you started. The password goes into the page, never to the model."
        import:
          title: "Bring them with you"
          body: "Import from Chrome, Apple Passwords, Bitwarden or a pass store, and export them again whenever you like."
  yours:
    heading: Yours, and only yours
    lead: >-
      An agent that reaches every part of your life is only worth having if
      that life stays yours. TeaNode runs on hardware you own, keeps everything
      in your own database, and does nothing you have not turned on.
    points:
      hardware:
        title: On your hardware
        body: "One program and one PostgreSQL on a machine you own. Your mail, photos, health and money are stored there, with no account with us at all, and your passwords are sealed on your own devices, so even the server cannot read them."
      model:
        title: Your choice of model
        body: A hosted model is sent only what a turn needs. Point it at an Ollama or a vLLM of your own and nothing leaves the machine at all.
      say:
        title: Nothing without your say
        body: Every part is off until you turn it on, the agent reaches only what you grant, and it stops for your word before anything it cannot undo.
      open:
        title: Open, and yours to keep
        body: MIT licensed, every line on GitHub. Back it up, export it, erase any of it, or switch it off.
  phone:
    heading: TeaNode for iPhone
    lead: Your assistant, in your pocket.
    body: >-
      Chat with it, call it, answer it from a notification, and hand it what
      you are looking at from any app. One app for every TeaNode server: scan the code your dashboard shows and
      it connects as you, with nothing to type. It carries what the dashboard
      does, from mail and the calendar to photos, finance and knowledge, drawn in the
      system's own controls and at your text size.
    availability: In TestFlight now, and on its way to the App Store
    privacy: The app's privacy policy
    galleryLabel: Screens of the iPhone app, with invented data
    points:
      chat:
        title: The conversation, everywhere
        body: Every card the dashboard's drawer shows, including a coding session's question with its answers as buttons. Ask about a mail, a charge or a page from where it is.
      notify:
        title: Answer from the notification
        body: What needs you arrives as a notification you can reply to. A running turn sits on the lock screen as a Live Activity, and widgets show what is waiting and what is next.
      call:
        title: Call it, or ask Siri
        body: A real phone call you can cut into, on the speaker or in your headphones. Ask TeaNode and Call TeaNode work from Siri, Shortcuts and Control Center.
      share:
        title: Share anything to it
        body: A picture, a file, a link or some words go to your agent with a note. Paystubs and W-2s go straight to Taxes, and a bank's export to your statements.
      record:
        title: Record a meeting
        body: The phone records, the server transcribes as it goes, and an upload the network cut off carries on where it stopped.
      photos:
        title: Your photos, backed up
        body: The library goes to your server in the background and carries on where the network cut it off. A photo you delete on the phone stays on TeaNode.
      location:
        title: Where you have been
        body: Visits to your places are kept while the app is closed, on a map of your day, and shared only with the people you choose.
      search:
        title: "Search everything"
        body: "The Search tab looks through chats, mail, contacts, photos and the rest at once, and the three parts you use most sit in the tab bar."
      passwords:
        title: "Your passwords, in every app"
        body: "TeaNode is an AutoFill provider: Safari and other apps offer its logins, passkeys and one-time codes, opened with Face ID."
      setup:
        title: Mail, calendars and contacts too
        body: One profile adds your mailbox, calendars and contacts to the iPhone's own apps, and your address book can come in from the phone.
    captions:
      conversation: "The conversation: a mail drafted, a coding session's question, and a reply waiting for your word."
      chats: "A chat with Sam: a link shows short and clean, with a card of the page it leads to."
      mail: The inbox, with what is important and what needs a reply marked.
      followups: "What your agent is following from your mail: a parcel that stalled, a bill overdue, a form due Friday."
      photos: Your photos, month by month, backed up from the phone.
      location: "The whole screen is the map, with you and the people who share with you, and the day in a drawer over it."
      coding: "A live coding session's agents: what each was asked, its model, and whether it is still running."
      calendar: The month, with your reminders a tap away.
      finance: Where the money went, month by month.
      recording: "A recorded meeting: the summary, then the transcript, speaker by speaker."
      knowledge: "A page of memory Sam shared: a recipe, with the facts it holds."
      contacts: "Sam's card, from anywhere Sam appears: message, call, mail, directions, and where Sam is."
