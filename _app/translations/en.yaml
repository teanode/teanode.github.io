        unpaid: Two. Osborne & Sons, £4,200, thirty-one days over. Halliday, £980, eight days over, and that one is within the terms you agreed.
        chase: Written and waiting in Drafts. It is polite, it names the invoice and the date, and it does not mention the second one.
        parcel: Out for delivery, due before six. The carrier wrote at half seven this morning; the message is in Archive, sorted as a notification.
        file: Saved. It is a PDF, so I have left it for you rather than reading it out. Open it and I can work from what you tell me.
