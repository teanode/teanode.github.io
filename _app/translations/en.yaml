    reports: DMARC aggregate reports received about your domains, which show who is sending as them.
    report: One report. Which addresses sent mail as the domain, how much, and whether it passed.
  whyHeading: Why
  why: >-
    Running mail for a domain usually means either handing it to a provider,
    or assembling Postfix, Dovecot, OpenDKIM, OpenDMARC, SpamAssassin and a
    policy daemon and keeping them in agreement. TeaNode is one program and a
    PostgreSQL database, with the authentication that decides whether your
    mail is trusted built in.
  featuresHeading: What it does
  features:
    authenticates:
      title: Authenticates everything
      body: >-
        SPF, DKIM, DMARC and ARC on the way in, with the results shown per
        message. Your outbound mail is DKIM signed, and forwarded mail keeps an
        ARC chain so it still passes at the far end.
    forwards:
      title: Forwards flexibly
      body: >-
        Aliases match the address with a regular expression and send the
        message to an address, an HTTP endpoint, or another mail server. An
        empty pattern is a catch-all, which receives whatever nothing else
        matched.
    relays:
      title: Sends from your own addresses
      body: >-
        Per-device SMTP credentials on the submission port, so your phone,
        laptop and applications can send as any of your domains. Each
        credential can be limited to one sender address.
    shows:
      title: Shows you the mail
      body: >-
        The dashboard shows each message with its authentication verdicts, the
        delivery attempts and why any of them failed, and the body itself with
        scripts removed and remote images blocked until you ask for them.
    sends:
      title: Sends mail you write
      body: >-
        Templates with variables and translations, a layout around them,
        pictures served from your own domain, and a record of whether the
        recipient's mail program fetched them.
    reports:
      title: Reports on your domains
      body: >-
        Incoming DMARC aggregate reports are parsed and kept, which is how you
        find out that somebody is forging your domain.
    extras:
      title: Optional extras, all off by default
      body: >-
        ClamAV, SpamAssassin, GeoIP, an S3 mirror of stored messages, an
        outbound SOCKS5 proxy for hosts whose address has a poor reputation,
        and DNS-01 certificates if you need a wildcard.
    dashboard:
      title: One program, dashboard included
      body: >-
        The dashboard is built into the server, so there is nothing else to
        deploy. A command line client reaches the same API from anywhere.
  startHeading: Getting started
  startLead: Four commands with docker compose, then open the dashboard.
  startAfter: >-
    The first visitor to the dashboard creates the account. Add your domain
    there, and it lists the DNS records to publish.
  startWalkthrough: The quick start
  needHeading: What you need
  needs:
    domain: A domain, and the ability to edit its DNS.
    host: A host with a stable address, reachable on ports 25, 80, 443 and 587.
    docker: Docker with compose. The compose file starts PostgreSQL for you.
  needsAfter: >-
    Nothing else. No cloud account. Certificates are obtained
    automatically over HTTP-01, so there is no DNS API to configure.
