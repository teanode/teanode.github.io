  featuresHeading: What it does
  features:
    mailbox:
      title: A mailbox for every account
      body: Folders that nest, search across all of it, rules, drafts, a signature and an out-of-office reply.
    imap:
      title: IMAP for any mail program
      body: Read the same mailbox anywhere. One app password per device, which sends on the submission port too.
    authenticates:
      title: Authenticates and scores
      body: SPF, DKIM, DMARC and ARC on the way in, signed on the way out, and spam scored by a filter built in.
    forwards:
      title: Forwards flexibly
      body: Patterns route each address to a mailbox, an inbox elsewhere, a webhook or another server.
    access:
      title: People, groups and roles
      body: Permissions decide what each person sees, single sign-on follows your directory, and every change is logged.
    shows:
      title: Shows you every message
      body: The verdicts, the delivery attempts, and the DMARC reports about your domains.
