welcome:
  headline: Your own domains. The inbox you already have.
  lead: >-
    TeaNode is an open source mail server that gives every side project and
    early startup a real address at its own domain. It receives the mail,
    checks that it is genuine, and forwards it to the inbox you already read
    or to a webhook. Replies go out signed as the domain, so they arrive
    instead of landing in spam. There is no mailbox and no IMAP: you keep
    reading mail where you read it now.
