welcome:
  lead: >-
    Give every side project and every early startup a real address at its own
    domain, without running a mailbox for each one. TeaNode is a small
    open source mail server you run yourself. It receives mail for all of your domains, checks
    that it is genuine, and forwards it to the inbox you already read, or to a
    webhook. You can reply and send from those addresses too, signed with the
    domain's key so the mail arrives instead of landing in spam.
  notMailbox: >-
    It is not a mailbox server. There is no IMAP and no inbox. You keep
    reading mail wherever you read it now. TeaNode handles the domain, the
    authentication and the routing.
  getStarted: Get started
  readDocs: Read the documentation
