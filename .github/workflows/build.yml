name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: _app

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: _app/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    # static/ is what GitHub Pages serves, and it is committed, so a change to
    # the sources merged without a rebuild ships a stale site with nothing to
    # say so. The build is reproducible: unchanged sources produce identical
    # bytes and therefore identical content-hashed filenames.
    - name: Check the built site is committed
      working-directory: .
      run: |
        # porcelain rather than `git diff`, which cannot see an untracked
        # file. A source edit changes the bundle's content hash, so it is a
        # deletion of the old name plus a new file, and a diff-based check
        # would go green on a commit whose index.html names a bundle nobody
        # committed.
        changed=$(git status --porcelain -- static index.html 404.html sitemap.txt)
        if [ -n "$changed" ]; then
          echo "$changed"
          echo
          echo "the committed build output does not match these sources:"
          echo "run 'npm run build' in _app/ and commit the result."
          exit 1
        fi
